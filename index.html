<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sassy Shanker! 💅🔪</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Press Start 2P', system-ui;
            overflow: hidden;
            image-rendering: pixelated;
        }

        canvas {
            image-rendering: pixelated;
            border: 8px solid #ff00ff;
            box-shadow: 0 0 0 8px #000,
                        0 0 0 16px #00ffff;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            z-index: 10;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
        }

        .bar-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .label {
            font-size: 14px;
            white-space: nowrap;
        }

        .bar {
            flex: 1;
            height: 24px;
            background: #222;
            border: 4px solid #ff00ff;
            position: relative;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            transition: width 0.2s;
        }

        #money {
            font-size: 28px;
            color: #00ff00;
        }

        #start-screen, #game-over-screen, #level-complete-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff00ff;
            text-align: center;
            z-index: 100;
        }

        h1 {
            font-size: 48px;
            margin: 0;
            text-shadow: 6px 6px 0 #00ffff;
            animation: sass-pulse 1s infinite alternate;
        }

        button {
            margin-top: 30px;
            padding: 20px 40px;
            font-family: 'Press Start 2P', system-ui;
            font-size: 24px;
            background: #ff00ff;
            color: #000;
            border: 6px solid #00ffff;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            transform: scale(1.1) rotate(5deg);
            background: #00ffff;
            color: #ff00ff;
        }

        @keyframes sass-pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="ui">
        <div class="bar-container">
            <div class="label">💰 LUNCH MONEY</div>
            <div id="money">$0000</div>
        </div>

        <div class="bar-container">
            <div class="label">🔥 HEAT</div>
            <div class="bar"><div id="heat-bar" class="fill" style="background: linear-gradient(90deg, #ffff00, #ff0000); width: 0%;"></div></div>
        </div>

        <div class="bar-container">
            <div class="label">💅 SASS COMBO</div>
            <div id="combo" style="font-size:24px; color:#00ffff;">×1</div>
        </div>

        <div id="boss-bar-container" class="bar-container" style="display:none;">
            <div class="label" style="color:#ff4400;">ODD'S RAGE</div>
            <div class="bar" style="border-color:#ff4400;">
                <div id="boss-bar" class="fill" style="background: linear-gradient(90deg,#ff6600,#ff0000); width:100%;"></div>
            </div>
            <div id="boss-phase" style="font-size:10px; color:#ff4400; white-space:nowrap; margin-top:2px;">PHASE 1</div>
        </div>
    </div>

    <div id="start-screen">
        <h1>SASSY SHANKER!</h1>
        <p style="font-size:24px; margin:20px 0; color:#00ffff;">Rob the playground. Own the streets. Slay the game.</p>
        <button onclick="startGame()">START STRUTTIN' 💅</button>
        <p style="margin-top:40px; font-size:14px;">← → or A/D = Strut SPACE = Jump J or Click = SASSY SHANK</p>
    </div>

    <div id="game-over-screen">
        <h1>GIRL, YOU GOT CAUGHT!</h1>
        <p id="final-score" style="font-size:28px; color:#ff0000; margin:20px 0;"></p>
        <button onclick="restartGame()">TRY AGAIN QUEEN</button>
    </div>

    <div id="level-complete-screen">
        <h1>LEVEL COMPLETE, BESTIE!</h1>
        <p id="level-score" style="font-size:28px; color:#00ff00; margin:20px 0;"></p>
        <button onclick="nextLevel()">NEXT LEVEL →</button>
    </div>

    <script>
        // =============================================
        // SASSY SHANKER! - Full Browser Game
        // Single-file HTML5 Canvas masterpiece
        // =============================================

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let gameState = 'start'; // start, playing, paused, gameover, levelcomplete
        let score = 0;
        let heat = 0;
        let combo = 1;
        let comboTimer = 0;
        let currentLevel = 1;
        let boss = null;
        const WIN_SCORE = { 1: 150, 2: 300, 3: 0 };

        // Player object
        let player = {
            x: 150,
            y: 400,
            width: 80,
            height: 120,
            vx: 0,
            vy: 0,
            speed: 6,
            jumpPower: -18,
            onGround: false,
            facing: 1,
            shankCooldown: 0,
            animationFrame: 0,
            shankFreezeTimer: 0,   // counts down during the freeze at connection
            shankHitVictim: null,  // reference to the victim being stabbed
            shankSoundPlayed: false,
            crouching: false,
            state: 'idle'
        };

        // Camera
        let cameraX = 0;
        const LEVEL_WIDTH = 3800;

        // Level data - First Level: PLAYGROUND PANIC
        let level = {
            name: "Playground Panic",
            groundY: 520,
            bgColor: '#1a0033',
            parallaxLayers: [
                { color: '#330066', speed: 0.2, elements: [] },
                { color: '#6600cc', speed: 0.5, elements: [] }
            ],
            platforms: [
                // ground
                {x:0, y:520, w:LEVEL_WIDTH, h:200},
                // jungle gym platforms
                {x:600, y:400, w:280, h:20},
                {x:1100, y:320, w:180, h:20},
                {x:1600, y:450, w:220, h:20},
                {x:2100, y:280, w:300, h:20},
                {x:2600, y:380, w:150, h:20},
            ],
            victims: [],
            particles: [],
            moneyBags: []
        };

        // Victim template
        // Skin tones and hair options for victims
        const SKIN_TONES = ['#f5c8a8', '#d4a574', '#c08a5a', '#8d5e3c', '#5c3a1e'];
        const HAIR_COLORS = ['#0a0a0a', '#3a1a0a', '#6a4a2a', '#c8a050', '#aa3322', '#ddd'];
        const HAIR_STYLES = ['buzz', 'curly', 'ponytail', 'bowl', 'mohawk', 'bald', 'long', 'afro'];

        class Victim {
            constructor(x, type, pose) {
                this.x = x;
                this.width = 60;
                this.height = 90;
                this.type = type;
                this.pose = pose || 'standing'; // 'standing', 'sitting_swing', 'sitting_bench'
                // Y position depends on pose — standing on ground, sitting is higher
                if (this.pose === 'sitting_swing') {
                    this.y = level.groundY - 40; // sitting height on swing
                } else if (this.pose === 'sitting_bench') {
                    this.y = level.groundY - 50; // sitting on bench
                } else {
                    this.y = level.groundY; // feet on ground
                }
                this.wallet = type === 'kid' ? 25
                    : type === 'teen' ? 45
                    : type === 'nerd' ? 60
                    : type === 'shopper' ? 65
                    : type === 'store_clerk' ? 45
                    : type === 'security_guard' ? 80
                    : 100; // lunchlady
                this.trauma = 0;
                this.maxTrauma = type === 'kid' ? 80
                    : type === 'teen' ? 120
                    : type === 'nerd' ? 150
                    : type === 'shopper' ? 110
                    : type === 'store_clerk' ? 90
                    : type === 'security_guard' ? 180
                    : 150; // lunchlady
                this.alive = true;
                this.fainted = false;
                this.shankCount = 0;
                this.vx = 0;
                this.crying = false;
                this.animationOffset = Math.random() * Math.PI * 2;
                // Randomized appearance
                this.skin = SKIN_TONES[Math.floor(Math.random() * SKIN_TONES.length)];
                this.hairColor = HAIR_COLORS[Math.floor(Math.random() * HAIR_COLORS.length)];
                this.hairStyle = HAIR_STYLES[Math.floor(Math.random() * HAIR_STYLES.length)];
                this.shirtColor = `hsl(${Math.random()*360}, ${40+Math.random()*30}%, ${30+Math.random()*30}%)`;
                this.pantsColor = `hsl(${Math.random()*360}, ${20+Math.random()*20}%, ${20+Math.random()*20}%)`;
            }

            update() {
                if (!this.alive || this.fainted) return;
                // slight idle sway
                this.vx = Math.sin(Date.now()/300 + this.animationOffset) * 0.6;
                this.x += this.vx;
            }
        }

        // Particle system for sparkles, money, hearts
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8 - 3;
                this.life = 60;
                this.type = type; // 'sparkle', 'coin', 'heart', 'text'
                this.value = type === 'coin' ? Math.floor(Math.random()*8)+3 : 0;
                this.color = type === 'sparkle' ? '#ff00ff' : type === 'coin' ? '#00ff00' : '#ffff00';
                this.size = 12;
            }
        }

        // Boss — Odd (elderly man in disability scooter)
        class Boss {
            constructor() {
                this.x = 1800;
                this.y = level.groundY - 80;
                this.width = 120;
                this.height = 80;
                this.hp = 600;
                this.maxHp = 600;
                this.phase = 1;
                this.alive = true;
                this.fainted = false;
                this.vx = 0;
                this.vy = 0;
                this.onGround = true;
                this.facing = -1;
                this.skin = '#e8c8a8';
                this.animFrame = 0;
                this.state = 'patrol';
                this.stateTimer = 120;
                this.attackCooldown = 0;
                this.anger = 0;
                this.stunTimer = 0;
                this.chargeVx = 0;
                this.armAngle = 0;
                this.shakeX = 0;
                this.screamTimer = 0;
                this.screamText = '';
                this.screams = [
                    "GÅ AV VEIEN!", "PASS DEG!", "RINGTE POLITIET!",
                    "HAR DU INGEN VETT!", "UNGDOMMEN I DAG!", "RESPEKTER ELDRE!"
                ];
            }

            update() {
                if (!this.alive) return;

                if (this.phase === 1 && this.hp <= 400) this.enterPhaseTransition(2);
                else if (this.phase === 2 && this.hp <= 200) this.enterPhaseTransition(3);

                if (this.state === 'stun') {
                    this.stunTimer--;
                    this.vx *= 0.6;
                    if (this.stunTimer <= 0) { this.state = 'patrol'; this.stateTimer = 60; }
                    this.applyPhysics();
                    return;
                }

                if (this.state === 'phase_transition') {
                    this.stateTimer--;
                    if (this.stateTimer <= 0) { this.state = 'chase'; this.stateTimer = 120; }
                    return;
                }

                this.anger = Math.floor((1 - this.hp / this.maxHp) * 100);
                const dx = player.x - this.x;
                const dist = Math.abs(dx);
                this.facing = dx > 0 ? 1 : -1;
                this.stateTimer--;
                this.attackCooldown--;

                if (this.state === 'patrol') {
                    this.vx = this.facing * (2 + this.anger * 0.02);
                    if (dist < 400 || this.stateTimer <= 0) { this.state = 'chase'; this.stateTimer = 180; }
                } else if (this.state === 'chase') {
                    this.vx = this.facing * (4 + this.phase * 1.0 + this.anger * 0.03);
                    if (dist < 150 && this.attackCooldown <= 0) this.chooseAttack();
                    if (this.stateTimer <= 0) { this.state = 'patrol'; this.stateTimer = 90; }
                } else if (this.state === 'attack_throw') {
                    // Throws something from basket
                    this.vx *= 0.7;
                    this.animFrame++;
                    this.armAngle = this.animFrame < 12
                        ? (this.animFrame / 12) * Math.PI * 0.9
                        : Math.max(0, Math.PI * 0.9 - (this.animFrame - 12) * 0.18);
                    if (this.animFrame === 14) {
                        if (dist < 200 && Math.abs(this.y - player.y) < 120) {
                            heat = Math.min(99, heat + 15);
                            player.vx = this.facing * 10;
                            player.vy = -8;
                            for (let i = 0; i < 10; i++) {
                                const p = new Particle(player.x, player.y, 'sparkle');
                                p.color = '#ff4400'; level.particles.push(p);
                            }
                        }
                    }
                    if (this.animFrame > 28) {
                        this.state = 'chase'; this.stateTimer = 120;
                        this.attackCooldown = Math.max(40, 90 - this.anger);
                        this.animFrame = 0; this.armAngle = 0;
                    }
                } else if (this.state === 'attack_ram') {
                    // Full-speed scooter ram
                    if (this.animFrame === 0) {
                        this.chargeVx = this.facing * (12 + this.phase * 2);
                        this.screamText = this.screams[Math.floor(Math.random() * this.screams.length)];
                        this.screamTimer = 80;
                    }
                    this.vx = this.chargeVx;
                    this.chargeVx *= 0.95;
                    this.animFrame++;
                    if (Math.abs(player.x - this.x) < 130 && Math.abs(player.y - this.y) < 100) {
                        heat = Math.min(99, heat + 20);
                        player.vx = this.facing * 14;
                        player.vy = -10;
                        this.chargeVx = 0;
                    }
                    if (this.animFrame > 45 || Math.abs(this.chargeVx) < 1) {
                        this.state = 'chase'; this.stateTimer = 90;
                        this.attackCooldown = Math.max(50, 110 - this.anger);
                        this.animFrame = 0;
                    }
                } else if (this.state === 'attack_honk') {
                    // HONK!! — AOE horn blast
                    if (this.animFrame === 0) {
                        this.screamText = "HONK!!!";
                        this.screamTimer = 60;
                        this.shakeX = 20;
                        if (dist < 260) {
                            heat = Math.min(99, heat + 25);
                            player.vy = -10;
                            for (let i = 0; i < 20; i++) {
                                const p = new Particle(this.x + 60, this.y + 20, 'sparkle');
                                p.color = '#ffff00'; p.vx *= 2; p.vy *= 2;
                                level.particles.push(p);
                            }
                        }
                    }
                    this.vx *= 0.8;
                    this.animFrame++;
                    if (this.animFrame > 35) {
                        this.state = 'chase'; this.stateTimer = 120;
                        this.attackCooldown = Math.max(60, 130 - this.anger);
                        this.animFrame = 0;
                    }
                }

                if (this.shakeX > 0) this.shakeX = Math.max(0, this.shakeX - 1.5);
                if (this.shakeX > 0) cameraX += Math.sin(Date.now() / 50) * this.shakeX * 0.4;
                if (this.screamTimer > 0) this.screamTimer--;
                this.applyPhysics();
                this.x = Math.max(100, Math.min(LEVEL_WIDTH - 200, this.x));
            }

            chooseAttack() {
                this.animFrame = 0;
                if (this.phase === 1) {
                    this.state = 'attack_throw';
                } else if (this.phase === 2) {
                    this.state = Math.random() > 0.5 ? 'attack_throw' : 'attack_ram';
                } else {
                    const r = Math.random();
                    this.state = r < 0.3 ? 'attack_throw' : r < 0.6 ? 'attack_ram' : 'attack_honk';
                }
            }

            enterPhaseTransition(n) {
                this.phase = n;
                this.state = 'phase_transition';
                this.stateTimer = 90;
                this.vx = 0;
                for (let i = 0; i < 30; i++) {
                    const angle = (i / 30) * Math.PI * 2;
                    const p = new Particle(this.x + 60, this.y + 40, 'sparkle');
                    p.vx = Math.cos(angle) * 8; p.vy = Math.sin(angle) * 8;
                    p.color = n === 2 ? '#ffaa00' : '#ff0000';
                    level.particles.push(p);
                }
                this.screamText = n === 2 ? "FULL GASS!!!" : "GUD BEDRE MEG!!!";
                this.screamTimer = 120;
            }

            takeDamage(amount) {
                if (this.state === 'phase_transition') return;
                this.hp = Math.max(0, this.hp - amount);
                this.stunTimer = 18;
                this.state = 'stun';
                this.animFrame = 0;
                if (this.hp <= 0) { this.alive = false; this.fainted = true; this.triggerDefeat(); }
            }

            triggerDefeat() {
                for (let i = 0; i < 40; i++) {
                    const types = ['sparkle', 'heart', 'coin'];
                    const p = new Particle(this.x + 60, this.y + 30, types[i % 3]);
                    p.vx = (Math.random() - 0.5) * 16;
                    p.vy = (Math.random() - 0.5) * 16 - 4;
                    p.life = 90; level.particles.push(p);
                }
                setTimeout(() => {
                    if (gameState === 'playing') {
                        gameState = 'levelcomplete';
                        document.getElementById('level-complete-screen').style.display = 'flex';
                        document.getElementById('level-score').innerHTML =
                            `ODD DEFEATED!<br>LUNCH MONEY: <span style="color:#00ff00">$${score}</span>`;
                    }
                }, 1500);
            }

            applyPhysics() {
                this.vy += 0.9;
                this.x += this.vx;
                this.y += this.vy;
                this.onGround = false;
                if (this.y + this.height >= level.groundY) {
                    this.y = level.groundY - this.height;
                    this.vy = 0; this.onGround = true;
                }
                for (let p of level.platforms) {
                    if (p.y >= 520) continue;
                    if (this.x + this.width > p.x && this.x < p.x + p.w &&
                        this.y + this.height > p.y && this.y + this.height - this.vy <= p.y) {
                        this.y = p.y - this.height;
                        this.vy = 0; this.onGround = true;
                    }
                }
                this.vx *= 0.85;
            }

            draw() {
                const bx = this.x - cameraX;
                const t = Date.now();
                const scooterColor = this.phase === 1 ? '#3355aa' : this.phase === 2 ? '#aa4422' : '#ff2200';
                const scooterAccent = this.phase === 1 ? '#4466cc' : this.phase === 2 ? '#cc5533' : '#ff4400';

                if (!this.alive && this.fainted) {
                    // Scooter tipped over
                    ctx.save();
                    ctx.translate(bx + 60, this.y + this.height);
                    ctx.rotate(0.6);
                    ctx.fillStyle = scooterColor;
                    ctx.fillRect(-50, -22, 100, 20);
                    ctx.fillStyle = '#333';
                    for (const wx of [-36, -12, 12, 36]) {
                        ctx.beginPath(); ctx.arc(wx, -8, 10, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.fillStyle = this.skin;
                    ctx.beginPath(); ctx.arc(-8, -36, 15, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                    return;
                }

                ctx.save();
                // Origin = bottom-center of collision box (ground level)
                ctx.translate(bx + 60, this.y + this.height);
                ctx.scale(this.facing, 1);

                // === WHEELS (4) ===
                ctx.fillStyle = '#222';
                for (const wx of [-44, -20, 16, 40]) {
                    ctx.beginPath(); ctx.arc(wx, -10, 12, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = '#666';
                for (const wx of [-44, -20, 16, 40]) {
                    ctx.beginPath(); ctx.arc(wx, -10, 5, 0, Math.PI * 2); ctx.fill();
                }

                // === CHASSIS ===
                ctx.fillStyle = scooterColor;
                ctx.fillRect(-54, -28, 108, 20);
                ctx.fillStyle = scooterAccent;
                ctx.fillRect(-54, -28, 108, 4);
                // Phase 3 flames
                if (this.phase === 3) {
                    const fl = Math.sin(t / 60);
                    ctx.fillStyle = `rgba(255,${100 + Math.floor(fl * 80)},0,0.75)`;
                    for (const fx of [-40, -10, 20]) {
                        ctx.beginPath();
                        ctx.moveTo(fx, -28);
                        ctx.lineTo(fx + 6, -38 - fl * 4);
                        ctx.lineTo(fx + 12, -28);
                        ctx.fill();
                    }
                }

                // === SEAT ===
                ctx.fillStyle = '#6a6555';
                ctx.fillRect(-22, -42, 44, 15);
                ctx.fillStyle = '#888870';
                ctx.fillRect(-22, -42, 44, 4);

                // === TILLER (positive x = front after scale) ===
                ctx.fillStyle = '#444';
                ctx.fillRect(30, -62, 6, 22);
                ctx.fillRect(20, -62, 30, 5);
                ctx.fillStyle = '#222';
                ctx.fillRect(20, -65, 6, 9);
                ctx.fillRect(44, -65, 6, 9);

                // === FRONT BASKET ===
                ctx.strokeStyle = '#888870'; ctx.lineWidth = 2;
                ctx.strokeRect(42, -58, 22, 18);
                if (this.state !== 'attack_throw' || this.animFrame > 20) {
                    ctx.fillStyle = '#c89050';
                    ctx.fillRect(45, -55, 16, 12);
                }

                // === OLD MAN (upper body from seat up) ===
                const leanAngle = this.phase === 3 ? -0.28 : -0.08;
                ctx.save();
                ctx.translate(-4, -42);
                ctx.rotate(leanAngle);

                // Cardigan torso
                const cardiganColor = this.state === 'stun' ? '#ffccaa'
                    : this.phase === 3 ? '#cc4422' : '#c8a878';
                ctx.fillStyle = cardiganColor;
                ctx.fillRect(-17, -38, 36, 38);

                // V-collar
                ctx.fillStyle = '#d8b888';
                ctx.beginPath();
                ctx.moveTo(-5, -38); ctx.lineTo(1, -22); ctx.lineTo(8, -38);
                ctx.closePath(); ctx.fill();

                // RIGHT ARM — throw attack or idle fist-raised
                ctx.save();
                ctx.translate(17, -32);
                const armRot = this.state === 'attack_throw' ? -this.armAngle
                    : (this.state === 'attack_honk' && this.animFrame < 20) ? -1.3
                    : -0.15 - Math.sin(t / 400) * 0.08;
                ctx.rotate(armRot);
                ctx.fillStyle = cardiganColor;
                ctx.fillRect(-4, 0, 10, 20);
                ctx.fillStyle = this.skin;
                ctx.fillRect(-3, 20, 8, 10);
                ctx.beginPath(); ctx.arc(1, 32, 6, 0, Math.PI * 2); ctx.fill();
                ctx.restore();

                // LEFT ARM — resting on handlebar
                ctx.save();
                ctx.translate(-15, -30);
                ctx.rotate(0.35);
                ctx.fillStyle = cardiganColor;
                ctx.fillRect(-4, 0, 10, 20);
                ctx.fillStyle = this.skin;
                ctx.fillRect(-3, 20, 8, 10);
                ctx.restore();

                // HEAD
                ctx.fillStyle = this.state === 'stun' ? '#ffbbaa' : this.skin;
                ctx.beginPath(); ctx.arc(2, -54, 18, 0, Math.PI * 2); ctx.fill();

                // Wispy white hair (combover)
                ctx.fillStyle = '#e0e0e0';
                ctx.beginPath();
                ctx.ellipse(-4, -68, 11, 5, -0.2, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 1.5;
                for (let hi = -3; hi <= 3; hi++) {
                    ctx.beginPath();
                    ctx.moveTo(hi * 3, -66);
                    ctx.lineTo(hi * 3 + hi * 1.2, -73 - Math.abs(hi));
                    ctx.stroke();
                }

                // Big round glasses
                ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(180,220,255,0.25)';
                ctx.beginPath(); ctx.arc(-7, -52, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(10, -52, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(-1, -52); ctx.lineTo(4, -52); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-14, -52); ctx.lineTo(-20, -50);
                ctx.moveTo(17, -52); ctx.lineTo(23, -50);
                ctx.stroke();

                // Angry brows (deep furrow)
                ctx.strokeStyle = '#4a2a10'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(-13, -60); ctx.lineTo(-4, -57); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(4, -57);  ctx.lineTo(16, -60); ctx.stroke();

                // Mouth
                if (this.screamTimer > 20) {
                    ctx.fillStyle = '#8a3a20';
                    ctx.beginPath(); ctx.ellipse(2, -44, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.strokeStyle = '#8a3a20'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(2, -40, 5, 0.3, Math.PI - 0.3); ctx.stroke();
                }

                ctx.restore(); // end lean

                // SCREAM TEXT
                if (this.screamTimer > 0) {
                    ctx.globalAlpha = Math.min(1, this.screamTimer / 20);
                    ctx.fillStyle = '#ff00ff';
                    ctx.font = 'bold 10px "Press Start 2P", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.screamText, 0, -108);
                    ctx.globalAlpha = 1;
                }

                ctx.restore();
            }
        }

        // Keyboard
        let keys = {};
        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

        // Mouse / Touch for shank
        let mouseX = 0, mouseY = 0;
        canvas.addEventListener('mousedown', e => {
            if (gameState === 'playing') attemptShank();
        });
        canvas.addEventListener('touchstart', e => {
            if (gameState === 'playing') {
                e.preventDefault();
                attemptShank();
            }
        });

        function attemptShank() {
            if (player.shankCooldown > 0) return;

            // Crouch shank — launch forward in a dramatic lunge
            if (player.crouching) {
                player.state = 'crouchShank';
                player.animationFrame = 0;
                player.shankSoundPlayed = false;
                player.shankHitVictim = null;
                player.shankCooldown = 70;
                player.crouching = false;
                player.vx = player.facing * 15;
                return;
            }

            player.state = 'shank';
            player.animationFrame = 0;
            player.shankFreezeTimer = 0;
            player.shankSoundPlayed = false;
            player.shankHitVictim = null;
            player.shankCooldown = 50;

            // Find nearby victim — store reference, apply damage at connection
            let hit = false;
            const playerCenterY = player.y + player.height / 2;
            for (let v of level.victims) {
                if (!v.alive) continue;
                const dx = v.x - player.x;
                if (Math.abs(dx) < 140 && Math.abs(v.y - playerCenterY) < 150) {
                    hit = true;
                    player.shankHitVictim = v;
                    v.crying = true; // will be set during connection
                    break;
                }
            }

            // Boss hit (Level 3)
            if (!hit && currentLevel === 3 && boss && boss.alive) {
                const bdx = boss.x - player.x;
                if (Math.abs(bdx) < 160 && Math.abs(boss.y - playerCenterY) < 160) {
                    hit = true;
                    const dmg = Math.floor(35 + combo * 10);
                    boss.takeDamage(dmg);
                    createShankEffects(boss.x, boss.y - 60);
                    score += Math.floor(dmg * 0.5 * combo);
                    combo = Math.min(8, combo + 1);
                    comboTimer = 120;
                }
            }

            if (!hit) {
                // Miss = small heat + lame animation
                heat += 4;
                combo = Math.max(1, combo - 2);
            }

        }

        function createShankEffects(x, y) {
            // Massive sparkles + hearts + dramatic lines
            for (let i = 0; i < 28; i++) {
                const p = new Particle(x, y, 'sparkle');
                p.vx *= 1.8;
                p.vy *= 1.8;
                level.particles.push(p);
            }
            // hearts
            for (let i = 0; i < 8; i++) {
                const p = new Particle(x + Math.random()*60-30, y + Math.random()*40-20, 'heart');
                level.particles.push(p);
            }
            // money text pop
            const moneyPop = new Particle(x+40, y-30, 'text');
            moneyPop.value = Math.floor(Math.random()*12 + 8);
            level.particles.push(moneyPop);
        }

        function createFaintEffects(x, y) {
            for (let i = 0; i < 15; i++) {
                const p = new Particle(x, y-20, 'heart');
                p.vy = -Math.random()*6 - 2;
                p.life = 45;
                level.particles.push(p);
            }
            // dramatic "X_X" faint
        }

        // Preload sounds
        const shankSounds = [
            new Audio('quack.mp3'),
            new Audio('Nytt opptak 28.m4a'),
            new Audio('Nytt opptak 29.m4a'),
        ];
        shankSounds.forEach(s => s.volume = 0.5);
        const roleRevealSound = new Audio('role-reveal.mp3');
        roleRevealSound.volume = 0.6;

        function playSassSound() {
            const base = shankSounds[Math.floor(Math.random() * shankSounds.length)];
            const snd = base.cloneNode();
            snd.volume = 0.4 + Math.random() * 0.2;
            snd.playbackRate = 0.9 + Math.random() * 0.3;
            snd.play().catch(() => {});
        }

        function playStartSound() {
            roleRevealSound.currentTime = 0;
            roleRevealSound.play().catch(() => {});
        }

        function drawPlayer() {
            const px = player.x - cameraX;
            const py = player.y;
            const f = player.animationFrame;
            const isShank = player.state === 'shank';
            const isCrouchShank = player.state === 'crouchShank';
            const t = Date.now();

            // Shank phases (30 frames + 30 freeze at frame 16):
            // 0-8: turn back to victim (flip) + show profile + start arch
            // 9-16: deep backward arch, knife over head, blade connects at 16 → FREEZE 0.5s
            // 17-24: spring back upright
            // 25-30: turn back to face forward
            const shankPhase = isShank ? (f <= 8 ? 0 : f <= 16 ? 1 : f <= 24 ? 2 : 3) : -1;
            const isFrozen = isShank && f === 16 && player.shankFreezeTimer > 0;
            const csPhase = isCrouchShank ? (f < 7 ? 0 : f < 15 ? 1 : f < 23 ? 2 : 3) : -1;

            // How much we've turned to face away (0→1)
            let turnAway = 0;
            // Profile narrowing (1=front, 0.55=profile)
            let profileScale = 1;
            // Backward arch angle (positive = arch backward, since char is flipped)
            let archAngle = 0;

            if (shankPhase === 0) {
                const e = f / 8;
                turnAway = e;         // turning away from victim
                profileScale = 1 - e * 0.45; // narrow to profile
                archAngle = e * 0.3;  // start arching
            } else if (shankPhase === 1 || isFrozen) {
                const e = Math.min(1, (f - 9) / 7);
                turnAway = 1;
                profileScale = 0.55;
                archAngle = 0.3 + e * 0.55; // deep arch at 0.85 rad
            } else if (shankPhase === 2) {
                const e = (f - 17) / 7;
                turnAway = 1 - e;
                profileScale = 0.55 + e * 0.45;
                archAngle = 0.85 * (1 - e);
            } else if (shankPhase === 3) {
                const e = (f - 25) / 5;
                turnAway = 0;
                profileScale = 1;
                archAngle = 0;
            }

            ctx.save();
            ctx.translate(px + player.width/2, py + player.height/2);

            // Facing: normally face toward victim. During shank, flip to face AWAY.
            const baseFacing = player.facing;
            if (isShank && turnAway > 0) {
                // Flip: face opposite direction (back to victim)
                ctx.scale(-baseFacing * (turnAway > 0.5 ? 1 : -1), 1);
            } else {
                if (baseFacing < 0) ctx.scale(-1, 1);
            }

            // Profile narrowing
            if (isShank) {
                ctx.scale(profileScale, 1);
            }

            // Backward arch — pivot from hips, arch upper body backward
            if (isShank && archAngle > 0) {
                ctx.translate(0, 40);
                ctx.rotate(-archAngle); // negative = lean back
                ctx.translate(0, -40);
            }

            // Crouch squat — squash vertically, pivot from feet so they stay on ground
            if (player.state === 'crouch') {
                ctx.translate(0, player.height / 2 * 0.35);
                ctx.scale(1, 0.65);
            }

            // CrouchShank lunge — tilt body forward around hip pivot
            if (isCrouchShank) {
                let lunge;
                if      (csPhase === 0) lunge = (f / 7) * 0.3;
                else if (csPhase === 1) lunge = 0.3 + ((f - 7) / 8) * 1.1;
                else if (csPhase === 2) lunge = 1.4 - ((f - 15) / 8) * 1.2;
                else                   lunge = 0.2 - ((f - 23) / 7) * 0.2;
                ctx.translate(0, 40);
                ctx.rotate(lunge);
                ctx.translate(0, -40);
            }

            // Walk bob & lean
            const walkBob = player.state === 'walk' ? Math.sin(t / 80) * 3 : 0;
            const walkLean = player.state === 'walk' ? Math.sin(t / 160) * 0.05 : 0;
            ctx.rotate(walkLean);

            // Ragdoll dangle parameters — arms swing with momentum
            const dangleT = t / 1000;
            const velDangle = player.vx * 0.08; // arms trail behind movement
            const idleDangle = Math.sin(dangleT * 1.8) * 0.12;

            // === HAIR (short black, tight) ===
            ctx.fillStyle = '#0a0a0a';
            // Main hair shape
            ctx.beginPath();
            ctx.ellipse(0, -40 + walkBob, 24, 18, 0, Math.PI, Math.PI * 2);
            ctx.fill();
            // Top
            ctx.beginPath();
            ctx.ellipse(0, -44 + walkBob, 20, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            // Sides (fade/taper)
            ctx.fillStyle = '#151515';
            ctx.beginPath();
            ctx.ellipse(-18, -30 + walkBob, 6, 12, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(18, -30 + walkBob, 6, 12, -0.2, 0, Math.PI * 2);
            ctx.fill();
            // Hair shine
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.ellipse(5, -48 + walkBob, 8, 4, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // === HEAD ===
            ctx.fillStyle = '#d4a574';
            ctx.beginPath();
            ctx.arc(0, -24 + walkBob, 20, 0, Math.PI * 2);
            ctx.fill();
            // Jaw
            ctx.beginPath();
            ctx.ellipse(0, -8 + walkBob, 13, 9, 0, 0, Math.PI);
            ctx.fill();

            // === FACE ===
            const blinkCycle = Math.sin(t / 2500);
            const eyeOpen = blinkCycle > 0.95 ? 0.2 : 1;
            const lookDir = player.vx !== 0 ? player.vx * 0.25 : 0;

            // Eye whites
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(-7, -27 + walkBob, 5.5, 4 * eyeOpen, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(7, -27 + walkBob, 5.5, 4 * eyeOpen, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pupils
            if (eyeOpen > 0.5) {
                ctx.fillStyle = '#1a0800';
                ctx.beginPath();
                ctx.arc(-7 + lookDir, -27 + walkBob, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(7 + lookDir, -27 + walkBob, 3, 0, Math.PI * 2);
                ctx.fill();
                // Shine
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-5.5 + lookDir, -29 + walkBob, 1.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(8.5 + lookDir, -29 + walkBob, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Eyebrows (thick, dark)
            ctx.strokeStyle = '#0a0a0a';
            ctx.lineWidth = 3;
            if (isShank) {
                // Mean frown
                ctx.beginPath();
                ctx.moveTo(-13, -35 + walkBob);
                ctx.lineTo(-3, -32 + walkBob);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(3, -32 + walkBob);
                ctx.lineTo(13, -35 + walkBob);
                ctx.stroke();
            } else {
                // Relaxed / slightly raised
                ctx.beginPath();
                ctx.moveTo(-12, -34 + walkBob);
                ctx.quadraticCurveTo(-7, -36 + walkBob, -2, -33 + walkBob);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(2, -33 + walkBob);
                ctx.quadraticCurveTo(7, -36 + walkBob, 12, -34 + walkBob);
                ctx.stroke();
            }

            // Nose
            ctx.strokeStyle = '#b08a60';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -22 + walkBob);
            ctx.lineTo(2, -16 + walkBob);
            ctx.lineTo(-1, -14 + walkBob);
            ctx.stroke();

            // Mouth
            if (shankPhase === 0) {
                // Gritted teeth — focused
                ctx.fillStyle = '#aa2233';
                ctx.beginPath();
                ctx.ellipse(0, -8 + walkBob, 5, 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillRect(-4, -10 + walkBob, 8, 2);
                ctx.fillRect(-4, -8 + walkBob, 8, 2);
                ctx.fillStyle = '#aa2233';
                ctx.fillRect(-1, -10 + walkBob, 1, 4);
                ctx.fillRect(2, -10 + walkBob, 1, 4);
            } else if (shankPhase === 1 || isFrozen) {
                // Connection — open mouth yell
                ctx.fillStyle = '#aa2233';
                ctx.beginPath();
                ctx.ellipse(0, -8 + walkBob, 7, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillRect(-4, -13 + walkBob, 8, 3);
            } else if (shankPhase === 2 || shankPhase === 3) {
                // Smirk
                ctx.strokeStyle = '#884444';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(-5, -8 + walkBob);
                ctx.quadraticCurveTo(2, -3 + walkBob, 8, -9 + walkBob);
                ctx.stroke();
            } else {
                // Neutral / slight grin
                ctx.strokeStyle = '#884444';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(-4, -8 + walkBob);
                ctx.quadraticCurveTo(1, -5 + walkBob, 6, -9 + walkBob);
                ctx.stroke();
            }

            // Stubble (subtle dots)
            ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
            for (let sx = -8; sx < 10; sx += 3) {
                for (let sy = -6; sy < 2; sy += 3) {
                    if (Math.sqrt(sx*sx + sy*sy) < 12) {
                        ctx.fillRect(sx, sy + walkBob, 1.5, 1.5);
                    }
                }
            }

            // === BODY — TRACKSUIT ===
            // Tracksuit jacket (dark with stripes)
            ctx.fillStyle = '#1a1a2a';
            // Torso
            ctx.beginPath();
            ctx.moveTo(-24, -4);
            ctx.lineTo(24, -4);
            ctx.lineTo(26, 42);
            ctx.lineTo(-26, 42);
            ctx.closePath();
            ctx.fill();

            // Tracksuit stripes (down the sides)
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 3;
            // Left stripe
            ctx.beginPath();
            ctx.moveTo(-22, -2);
            ctx.lineTo(-24, 42);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-18, -2);
            ctx.lineTo(-20, 42);
            ctx.stroke();
            // Right stripe
            ctx.beginPath();
            ctx.moveTo(22, -2);
            ctx.lineTo(24, 42);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(18, -2);
            ctx.lineTo(20, 42);
            ctx.stroke();

            // Zipper line
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -2);
            ctx.lineTo(0, 40);
            ctx.stroke();
            // Zipper pull
            ctx.fillStyle = '#ccc';
            ctx.fillRect(-2, 14, 4, 6);

            // Collar (high, tracksuit style)
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(-16, -8, 32, 6);
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-14, -8);
            ctx.lineTo(-14, -2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(14, -8);
            ctx.lineTo(14, -2);
            ctx.stroke();

            // === ARMS (ragdoll dangling) ===
            let leftArmAngle, rightArmAngle;
            let leftForearm, rightForearm; // extra dangle for forearm

            if (shankPhase === 0) {
                const e = f / 8;
                // Left arm hangs down naturally
                leftArmAngle = 0.3 * e;
                leftForearm = 0.1 * e;
                // Right arm (knife) starts rising overhead
                rightArmAngle = -2.0 * e; // arm goes up over head
                rightForearm = -0.4 * e;
            } else if (shankPhase === 1 || isFrozen) {
                // Knife arm reaches OVER head and BEHIND — arching back toward victim
                const e = Math.min(1, (f - 9) / 7);
                const breathe = (f === 16) ? Math.sin(player.shankFreezeTimer / 5) * 0.01 : 0;
                leftArmAngle = 0.3 + 0.4 * e + breathe; // arm trails down/back
                leftForearm = 0.1 + 0.2 * e;
                // Knife arm goes from overhead (-2.0) further back to (-3.2)
                // Since body is arched back, this makes knife reach behind and down
                rightArmAngle = -2.0 - 1.2 * e + breathe;
                rightForearm = -0.4 - 0.5 * e; // forearm extends for maximum reach
            } else if (shankPhase === 2) {
                // Spring back — arms return
                const e = (f - 17) / 7;
                leftArmAngle = 0.7 * (1 - e) + idleDangle * e;
                leftForearm = 0.3 * (1 - e) + 0.15 * e;
                rightArmAngle = -3.2 * (1 - e) + 0.05 * e;
                rightForearm = -0.9 * (1 - e) + 0.12 * e;
            } else if (shankPhase === 3) {
                leftArmAngle = idleDangle;
                rightArmAngle = 0.05 - idleDangle;
                leftForearm = 0.15;
                rightForearm = 0.12;
            } else if (player.state === 'walk') {
                // Ragdoll swing — arms dangle and lag behind
                const swing = Math.sin(t / 130) * 0.6;
                leftArmAngle = 0.05 + swing - velDangle;
                rightArmAngle = 0.05 - swing - velDangle;
                // Forearms swing with extra delay (more dangle)
                const foreSwing = Math.sin(t / 130 - 0.5) * 0.4;
                leftForearm = 0.2 + foreSwing;
                rightForearm = 0.2 - foreSwing;
            } else if (player.state === 'jump') {
                // Ragdoll dangle driven by vertical velocity
                // Going up (vy<0): arms trail down; falling (vy>0): forearms flop forward
                const vyDangle = player.vy * 0.028;
                leftArmAngle  =  0.4 + idleDangle + vyDangle;
                rightArmAngle =  0.35 - idleDangle + vyDangle;
                leftForearm   =  0.8 + vyDangle * 1.6;
                rightForearm  =  0.7 + vyDangle * 1.6;
            } else if (player.state === 'crouch') {
                // Crouched: arms low and forward, coiled to spring
                leftArmAngle  = 0.8;
                rightArmAngle = 0.7;
                leftForearm   = 0.5;
                rightForearm  = 0.5;
            } else if (isCrouchShank) {
                // Lunge: knife arm thrusts forward (body rotation makes "up" = forward in world)
                if (csPhase <= 1) {
                    leftArmAngle  =  0.5;
                    rightArmAngle = -1.8 - csPhase * 0.3;
                    leftForearm   =  0.3;
                    rightForearm  = -0.8;
                } else {
                    leftArmAngle  =  0.5;
                    rightArmAngle = -0.8 + (csPhase - 2) * 0.3;
                    leftForearm   =  0.3;
                    rightForearm  = -0.3;
                }
            } else {
                // Idle: arms hang with slight sway
                leftArmAngle = 0.08 + idleDangle;
                rightArmAngle = 0.05 - idleDangle;
                leftForearm = 0.15 + Math.sin(dangleT * 2.2) * 0.08;
                rightForearm = 0.12 - Math.sin(dangleT * 2.5) * 0.08;
            }

            // Tracksuit sleeve color
            const sleeveColor = '#1a1a2a';
            const skinColor = '#d4a574';

            // Left arm (upper + forearm)
            ctx.save();
            ctx.translate(-24, 0);
            ctx.rotate(leftArmAngle);
            ctx.fillStyle = sleeveColor;
            ctx.fillRect(-5, 0, 10, 24);
            // Sleeve stripe
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-5, 2);
            ctx.lineTo(-5, 24);
            ctx.stroke();
            // Forearm (skin, dangles further)
            ctx.translate(0, 24);
            ctx.rotate(leftForearm);
            ctx.fillStyle = skinColor;
            ctx.fillRect(-4, 0, 8, 20);
            // Hand
            ctx.beginPath();
            ctx.arc(0, 22, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Right arm (upper + forearm)
            ctx.save();
            ctx.translate(24, 0);
            ctx.rotate(rightArmAngle);
            ctx.fillStyle = sleeveColor;
            ctx.fillRect(-5, 0, 10, 24);
            // Sleeve stripe
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(5, 2);
            ctx.lineTo(5, 24);
            ctx.stroke();
            // Forearm
            ctx.translate(0, 24);
            ctx.rotate(rightForearm);
            ctx.fillStyle = skinColor;
            ctx.fillRect(-4, 0, 8, 20);
            // Hand
            if (player.state === 'crouch') {
                // Gang sign: index + pinky extended past fist, middle + ring curled (devil horns)
                ctx.fillStyle = skinColor;
                ctx.fillRect(-4, 20, 8,  8);  // fist / curled middle+ring
                ctx.fillRect( 4, 20, 3, 14);  // index finger extended (right of fist)
                ctx.fillRect(-7, 20, 3, 13);  // pinky finger extended (left of fist)
                // Nail lines at knuckles
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.fillRect( 4, 20, 3, 2);
                ctx.fillRect(-7, 20, 3, 2);
            } else {
                ctx.beginPath();
                ctx.arc(0, 22, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // Knife in right hand during shank or crouchShank lunge
            if (isShank || isCrouchShank) {
                ctx.fillStyle = '#333';
                ctx.fillRect(-3, 24, 6, 14); // handle (slightly bigger)
                // Handle wrap
                ctx.fillStyle = '#ff00ff';
                ctx.fillRect(-2, 26, 4, 2);
                ctx.fillRect(-2, 30, 4, 2);
                ctx.fillRect(-2, 34, 4, 2);
                // Long blade — reaches far down
                ctx.fillStyle = '#c0d8e8';
                ctx.beginPath();
                ctx.moveTo(-3, 38);
                ctx.lineTo(0, 90); // much longer blade
                ctx.lineTo(3, 38);
                ctx.closePath();
                ctx.fill();
                // Blade edge highlight
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 40);
                ctx.lineTo(0, 88);
                ctx.stroke();
                // Blade shine spots
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillRect(-1, 50, 2, 4);
                ctx.fillRect(-1, 65, 2, 3);
                // Glow on stab
                if (shankPhase === 2) {
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = '#00ffff';
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, 38);
                    ctx.lineTo(0, 90);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }
            ctx.restore();

            // === LEGS (tracksuit pants) ===
            const legSwing = player.state === 'walk' ? Math.sin(t / 120) * 0.35 : 0;

            // Wide stance during shank pose
            let leftLegAngle = legSwing;
            let rightLegAngle = -legSwing;
            let leftLegSpread = -10;
            let rightLegSpread = 10;

            if (shankPhase === 0) {
                const e = f / 8;
                leftLegAngle = 0.2 * e;
                rightLegAngle = -0.15 * e;
                leftLegSpread = -10 - 6 * e;
                rightLegSpread = 10 + 6 * e;
            } else if (shankPhase === 1 || isFrozen) {
                leftLegAngle = 0.2;
                rightLegAngle = -0.15;
                leftLegSpread = -16;
                rightLegSpread = 16;
            } else if (shankPhase === 2) {
                const e = (f - 17) / 7;
                leftLegAngle = 0.2 * (1 - e);
                rightLegAngle = -0.15 * (1 - e);
                leftLegSpread = -16 + 6 * e;
                rightLegSpread = 16 - 6 * e;
            } else if (shankPhase === 3) {
                leftLegAngle = 0;
                rightLegAngle = 0;
                leftLegSpread = -10;
                rightLegSpread = 10;
            } else if (player.state === 'crouch') {
                // Deep squat: wide bent stance
                leftLegAngle  =  0.6;
                rightLegAngle = -0.6;
                leftLegSpread = -18;
                rightLegSpread = 18;
            } else if (isCrouchShank && csPhase === 1) {
                // Mid-lunge stride: front leg punching forward, back leg trailing
                leftLegAngle  = -0.5;
                rightLegAngle =  0.6;
                leftLegSpread = -12;
                rightLegSpread = 16;
            }

            // Left leg (front in lunge)
            ctx.save();
            ctx.translate(leftLegSpread, 40);
            ctx.rotate(leftLegAngle);
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(-8, 0, 16, 36);
            // Pant stripe
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-8, 2);
            ctx.lineTo(-8, 36);
            ctx.stroke();
            // Shoe
            ctx.fillStyle = '#222';
            ctx.fillRect(-10, 34, 20, 8);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-8, 34, 16, 3); // sole line
            ctx.restore();

            // Right leg (back in lunge)
            ctx.save();
            ctx.translate(rightLegSpread, 40);
            ctx.rotate(rightLegAngle);
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(-8, 0, 16, 36);
            // Pant stripe
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(8, 2);
            ctx.lineTo(8, 36);
            ctx.stroke();
            // Shoe
            ctx.fillStyle = '#222';
            ctx.fillRect(-10, 34, 20, 8);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-8, 34, 16, 3);
            ctx.restore();

            ctx.restore(); // end main player transform

            // Connection flash during freeze
            if (isFrozen && player.shankFreezeTimer < 5) {
                ctx.globalAlpha = 0.3 * (1 - player.shankFreezeTimer / 5);
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.globalAlpha = 1;
            }
            // Knife impact sparkles during freeze
            if (isFrozen && player.shankHitVictim) {
                const v = player.shankHitVictim;
                const vsx = v.x - cameraX;
                ctx.globalAlpha = 0.5 + Math.sin(player.shankFreezeTimer / 2) * 0.3;
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                for (let i = 0; i < 6; i++) {
                    const ang = (player.shankFreezeTimer / 3 + i * Math.PI / 3);
                    const r = 12 + Math.sin(player.shankFreezeTimer / 2 + i) * 6;
                    ctx.beginPath();
                    ctx.moveTo(vsx, v.y - 60);
                    ctx.lineTo(vsx + Math.cos(ang) * r, v.y - 60 + Math.sin(ang) * r);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            // "SLAYING" tag at high combo
            if (combo > 3) {
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 18px Press Start 2P';
                ctx.textAlign = 'center';
                ctx.fillText('SLAYING', px + player.width/2, py - 30 + Math.sin(t / 300) * 4);
            }
        }

        function updatePlayer() {
            // CrouchShank lunge — physics-driven, bypasses normal movement
            if (player.state === 'crouchShank') {
                player.vx *= 0.87;
                player.vy += 0.9;
                player.x += player.vx;
                player.y += player.vy;
                player.onGround = false;
                if (player.y + player.height > level.groundY) {
                    player.y = level.groundY - player.height;
                    player.vy = 0;
                    player.onGround = true;
                }
                player.x = Math.max(80, Math.min(LEVEL_WIDTH - 200, player.x));
                // Hit detection at frame 8 — wide forward arc, 2.5× damage
                if (player.animationFrame === 8 && !player.shankSoundPlayed) {
                    player.shankSoundPlayed = true;
                    playSassSound();
                    const pcY = player.y + player.height / 2;
                    for (let v of level.victims) {
                        if (!v.alive) continue;
                        const dx = v.x - player.x;
                        if (dx * player.facing > 0 && Math.abs(dx) < 320 && Math.abs(v.y - pcY) < 150) {
                            player.shankHitVictim = v;
                            v.crying = true;
                            v.trauma += Math.floor((28 + combo * 8) * 2.5);
                            v.shankCount++;
                            createShankEffects(v.x, v.y);
                            createShankEffects(v.x + 30, v.y - 30);
                            score += Math.floor(v.wallet * 0.5 * combo);
                            v.wallet = Math.max(0, v.wallet - Math.floor(v.wallet * 0.5));
                            combo = Math.min(8, combo + 2);
                            comboTimer = 200;
                            if (v.trauma >= v.maxTrauma) {
                                v.fainted = true;
                                heat += 18;
                                createFaintEffects(v.x, v.y);
                            }
                            break;
                        }
                    }
                }
                player.animationFrame++;
                if (player.animationFrame > 30) {
                    player.state = 'idle';
                    player.shankHitVictim = null;
                    player.shankSoundPlayed = false;
                }
                if (player.shankCooldown > 0) player.shankCooldown--;
                const targetCam = player.x - 400;
                cameraX = Math.max(0, Math.min(LEVEL_WIDTH - canvas.width, cameraX * 0.92 + targetCam * 0.08));
                return;
            }

            // Crouch: hold S or ArrowDown while on ground
            player.crouching = (keys['s'] || keys['arrowdown']) && player.onGround && player.state !== 'shank';

            // Horizontal movement (locked while crouching)
            player.vx = 0;
            if (!player.crouching) {
                if (keys['a'] || keys['arrowleft']) {
                    player.vx = -player.speed;
                    player.facing = -1;
                }
                if (keys['d'] || keys['arrowright']) {
                    player.vx = player.speed;
                    player.facing = 1;
                }
            }

            // Jump
            if ((keys[' '] || keys['space']) && player.onGround) {
                player.vy = player.jumpPower;
                player.onGround = false;
            }

            // Gravity
            player.vy += 0.9;

            // Apply velocity
            player.x += player.vx;
            player.y += player.vy;

            // Ground collision
            player.onGround = false;
            if (player.y + player.height > level.groundY) {
                player.y = level.groundY - player.height;
                player.vy = 0;
                player.onGround = true;
            }

            // Platform collisions
            for (let p of level.platforms) {
                if (player.vx > 0 && player.x + player.width > p.x && player.x < p.x + p.w &&
                    player.y + player.height > p.y && player.y + player.height - player.vy <= p.y) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.onGround = true;
                }
            }

            // Keep in bounds
            player.x = Math.max(80, Math.min(LEVEL_WIDTH - 200, player.x));

            // Animation state
            if (player.state === 'shank') {
                // Freeze at connection point (frame 16) for 30 frames (~0.5s)
                if (player.animationFrame === 16 && player.shankFreezeTimer < 30) {
                    player.shankFreezeTimer++;
                    // On first freeze frame: play sound + apply damage
                    if (!player.shankSoundPlayed) {
                        player.shankSoundPlayed = true;
                        playSassSound();
                        const v = player.shankHitVictim;
                        if (v) {
                            v.crying = true;
                            v.trauma += 28 + combo * 8;
                            v.shankCount++;
                            createShankEffects(v.x + 20, v.y + 20);
                            score += Math.floor(v.wallet * 0.3 * combo);
                            v.wallet = Math.max(0, v.wallet - Math.floor(v.wallet * 0.3));
                            combo = Math.min(8, combo + 1);
                            comboTimer = 120;
                            if (v.trauma >= v.maxTrauma) {
                                v.fainted = true;
                                heat += 18;
                                createFaintEffects(v.x, v.y);
                            }
                        }
                    }
                } else {
                    player.animationFrame++;
                }
                if (player.animationFrame > 30) {
                    player.state = 'idle';
                    if (player.shankHitVictim) {
                        player.shankHitVictim.crying = false;
                    }
                    player.shankHitVictim = null;
                }
            } else if (player.crouching) {
                player.state = 'crouch';
            } else if (!player.onGround) {
                player.state = 'jump';
            } else if (Math.abs(player.vx) > 1) {
                player.state = 'walk';
            } else {
                player.state = 'idle';
            }

            // Cooldown
            if (player.shankCooldown > 0) player.shankCooldown--;

            // Camera follow
            const targetCam = player.x - 400;
            cameraX = Math.max(0, Math.min(LEVEL_WIDTH - canvas.width, cameraX * 0.92 + targetCam * 0.08));
        }

            return function() {

            };

        // === GROUND RENDERING ===
        function drawGround() {
            if (currentLevel === 2) { drawSkofabrikkenGround(); return; }
            if (currentLevel === 3) { drawTrimparkGround(); return; }
            const groundY = level.groundY; // 520

            // === DIRT / EARTH BASE LAYER ===
            const earthGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
            earthGrad.addColorStop(0, '#3a2a15');
            earthGrad.addColorStop(0.15, '#2a1c0e');
            earthGrad.addColorStop(0.5, '#1a120a');
            earthGrad.addColorStop(1, '#0d0805');
            ctx.fillStyle = earthGrad;
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // === GRASS LAYER (top of ground) ===
            // Grass base strip
            const grassGrad = ctx.createLinearGradient(0, groundY - 6, 0, groundY + 14);
            grassGrad.addColorStop(0, '#1a4a12');
            grassGrad.addColorStop(0.3, '#245518');
            grassGrad.addColorStop(0.7, '#1d3a14');
            grassGrad.addColorStop(1, '#2a1c0e');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, groundY - 4, canvas.width, 18);

            // Grass patches (dense clumps)
            for (let gp of bgElements.grassPatches) {
                const gpx = gp.x - cameraX;
                if (gpx + gp.w < -10 || gpx > canvas.width + 10) continue;

                const g = gp.shade;
                const r = Math.floor(20 + g * 20);
                const gr = Math.floor(60 + g * 40);
                const b = Math.floor(10 + g * 15);
                ctx.fillStyle = `rgba(${r}, ${gr}, ${b}, ${gp.density * 0.7})`;
                ctx.beginPath();
                ctx.ellipse(gpx + gp.w / 2, groundY + 2, gp.w / 2, 6, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // === WORN DIRT PATH (winding through the middle) ===
            ctx.save();
            ctx.beginPath();
            // Path follows a gentle sine wave across the level
            const pathW = 70;
            let first = true;
            for (let wx = -20; wx < canvas.width + 40; wx += 8) {
                const worldX = wx + cameraX;
                const pathOffset = Math.sin(worldX / 500) * 25 + Math.sin(worldX / 200) * 10;
                const py = groundY + 4 + pathOffset * 0.15;
                if (first) {
                    ctx.moveTo(wx, py - pathW * 0.1);
                    first = false;
                } else {
                    ctx.lineTo(wx, py - pathW * 0.1);
                }
            }
            for (let wx = canvas.width + 40; wx >= -20; wx -= 8) {
                const worldX = wx + cameraX;
                const pathOffset = Math.sin(worldX / 500) * 25 + Math.sin(worldX / 200) * 10;
                const py = groundY + 4 + pathOffset * 0.15;
                ctx.lineTo(wx, py + pathW * 0.12);
            }
            ctx.closePath();

            // Path fill — worn dirt
            const pathGrad = ctx.createLinearGradient(0, groundY - 2, 0, groundY + 16);
            pathGrad.addColorStop(0, '#4a3820');
            pathGrad.addColorStop(0.5, '#3d2e18');
            pathGrad.addColorStop(1, '#342816');
            ctx.fillStyle = pathGrad;
            ctx.fill();

            // Path edges — darker worn edges
            ctx.strokeStyle = 'rgba(30, 20, 10, 0.4)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // Dirt patches on path
            for (let dp of bgElements.dirtPatches) {
                const dpx = dp.x - cameraX;
                if (dpx + dp.w < -10 || dpx > canvas.width + 10) continue;

                ctx.fillStyle = dp.dark ? 'rgba(20, 14, 8, 0.4)' : 'rgba(60, 45, 25, 0.3)';
                ctx.beginPath();
                ctx.ellipse(dpx + dp.w / 2, groundY + 5, dp.w / 2, dp.h / 2, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Pebbles
            for (let pb of bgElements.pebbles) {
                const pbx = pb.x - cameraX;
                if (pbx < -10 || pbx > canvas.width + 10) continue;

                const s = pb.shade;
                ctx.fillStyle = `rgb(${Math.floor(80 * s)}, ${Math.floor(70 * s)}, ${Math.floor(60 * s)})`;
                ctx.beginPath();
                ctx.arc(pbx, pb.y, pb.r, 0, Math.PI * 2);
                ctx.fill();
            }

            // === INDIVIDUAL GRASS BLADES ===
            const windTime = Date.now() / 1000;
            for (let gb of bgElements.grassBlades) {
                const gbx = gb.x - cameraX;
                if (gbx < -20 || gbx > canvas.width + 20) continue;

                const wind = Math.sin(windTime * 1.5 + gb.x * 0.01) * 0.15;
                const s = gb.shade;
                const r = Math.floor(15 + s * 30);
                const g = Math.floor(50 + s * 50);
                const b = Math.floor(8 + s * 20);
                ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.lineWidth = gb.thick;

                ctx.beginPath();
                ctx.moveTo(gbx, groundY - 1);
                ctx.quadraticCurveTo(
                    gbx + (gb.lean + wind) * gb.h,
                    groundY - gb.h * 0.6,
                    gbx + (gb.lean + wind) * gb.h * 1.5,
                    groundY - gb.h
                );
                ctx.stroke();
            }

            // === GRASS TUFTS along path edges (small repeated clusters) ===
            for (let tx = 0; tx < canvas.width + 20; tx += 14) {
                const worldTx = tx + cameraX;
                const pathOffset = Math.sin(worldTx / 500) * 25 + Math.sin(worldTx / 200) * 10;

                // Top edge tufts
                const topY = groundY + 2 + pathOffset * 0.15 - 5;
                const bottomY = groundY + 4 + pathOffset * 0.15 + 6;

                // Use worldX for deterministic placement
                const hash = (worldTx * 7 + 13) % 17;
                if (hash > 6) {
                    const tH = 4 + (hash % 5);
                    const tWind = Math.sin(windTime * 1.2 + worldTx * 0.02) * 0.1;
                    ctx.strokeStyle = hash > 11 ? '#2a6618' : '#1d4a12';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(tx, topY);
                    ctx.quadraticCurveTo(tx + tWind * tH * 3, topY - tH * 0.6, tx + tWind * tH * 5, topY - tH);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(tx, bottomY);
                    ctx.quadraticCurveTo(tx - tWind * tH * 2, bottomY - tH * 0.5, tx - tWind * tH * 4, bottomY - tH * 0.8);
                    ctx.stroke();
                }
            }

            // === GROUND TEXTURE — subtle noise overlay ===
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = '#000';
            for (let nx = 0; nx < canvas.width; nx += 12) {
                for (let ny = groundY; ny < groundY + 40; ny += 12) {
                    const worldNx = nx + cameraX;
                    const noiseVal = ((worldNx * 31 + ny * 17) % 100) / 100;
                    if (noiseVal > 0.5) {
                        ctx.fillRect(nx, ny, 6, 6);
                    }
                }
            }
            ctx.globalAlpha = 1;
        }

        function drawBackground() {
            if (currentLevel === 2) { drawSkofabrikkenBackground(); return; }
            if (currentLevel === 3) { drawTrimparkBackground(); return; }
            // ================================================================
            // NEO-NOIR PLAYGROUND — Named Palette
            // ================================================================
            // SKY_BAND_0   = #0a0010  (near-black violet, top)
            // SKY_BAND_1   = #180028  (deep void purple)
            // SKY_BAND_2   = #280040  (rich night purple)
            // SKY_BAND_3   = #3d0055  (lifted purple, horizon glow)
            // SKY_BAND_4   = #2d0033  (settled purple, low sky)
            // BUILDING     = #0a000e  (near-black with purple whisper)
            // NEON_MAGENTA = #ff00ff
            // NEON_CYAN    = #00ffff
            // NEON_PINK    = #ff00aa
            // NEON_VIOLET  = #aa00ff
            // CLOUD_PINK   = #ff69b4
            // CLOUD_OUTLINE = #ff00ff
            // GUTTER       = #00ffff
            // ================================================================

            // === LAYER 0: SKY — pixel-banded gradient (parallax 0.1x) ===
            // Each band fills its pixel rows with a flat colour.
            // At each boundary the last 6 rows dither by alternating the two colours.
            const skyBands = [
                { y0: 0,   y1: 80,  color: '#0a0010' },
                { y0: 80,  y1: 180, color: '#180028' },
                { y0: 180, y1: 280, color: '#280040' },
                { y0: 280, y1: 360, color: '#3d0055' },
                { y0: 360, y1: 520, color: '#2d0033' },
            ];

            // Solid fill for each band
            for (const band of skyBands) {
                ctx.fillStyle = band.color;
                ctx.fillRect(0, band.y0, canvas.width, band.y1 - band.y0);
            }

            // Dither transitions: at each inter-band boundary alternate 1px rows
            for (let bi = 0; bi < skyBands.length - 1; bi++) {
                const boundary = skyBands[bi].y1;
                const colA = skyBands[bi].color;
                const colB = skyBands[bi + 1].color;
                const DITHER_PX = 6;
                for (let d = 0; d < DITHER_PX; d++) {
                    ctx.fillStyle = (d % 2 === 0) ? colA : colB;
                    ctx.fillRect(0, boundary - DITHER_PX + d, canvas.width, 1);
                }
            }

            // === LAYER 1: GOD-RAY OVERLAY (before buildings) ===
            // Seeded vertical semi-transparent magenta/violet rectangles
            const godRayData = [
                { x: 60,   w: 120, color: 'rgba(255,0,255,0.04)' },
                { x: 310,  w: 90,  color: 'rgba(170,0,255,0.03)' },
                { x: 540,  w: 180, color: 'rgba(255,0,255,0.04)' },
                { x: 820,  w: 80,  color: 'rgba(170,0,255,0.03)' },
                { x: 1020, w: 200, color: 'rgba(255,0,255,0.04)' },
                { x: 1180, w: 110, color: 'rgba(170,0,255,0.03)' },
            ];
            for (const ray of godRayData) {
                ctx.fillStyle = ray.color;
                ctx.fillRect(ray.x, 0, ray.w, 300);
            }

            // === LAYER 1.5: CLOUDS — hot-pink stepped pixel blocks (parallax 0.3x) ===
            // Shovel Knight style: three stacked rectangles (8/16/8 px heights)
            const cloudP = 0.3;
            for (const cl of bgElements.clouds) {
                const cx = cl.x - cameraX * cloudP;
                // Wrap cloud horizontally across the visible level width
                const cxWrapped = ((cx % (canvas.width + cl.w + 100)) + canvas.width + cl.w + 100) % (canvas.width + cl.w + 100) - cl.w;
                if (cxWrapped + cl.w < -20 || cxWrapped > canvas.width + 20) continue;

                const cy = cl.y;
                const cw = cl.w;

                // Stepped pixel-block shape: narrow / wide / narrow
                const midW = cw;
                const topW = Math.round(cw * 0.55);
                const botW = Math.round(cw * 0.7);
                const topOff = Math.round((cw - topW) / 2);
                const botOff = Math.round((cw - botW) / 2);

                // Fill: hot pink body
                ctx.fillStyle = '#ff69b4';
                ctx.fillRect(cxWrapped + topOff, cy,      topW, 8);
                ctx.fillRect(cxWrapped,           cy + 8,  midW, 16);
                ctx.fillRect(cxWrapped + botOff,  cy + 24, botW, 8);

                // 2px magenta outline on top-left edge only
                ctx.fillStyle = '#ff00ff';
                // Top edge of top block
                ctx.fillRect(cxWrapped + topOff, cy,     topW, 2);
                // Left edge of top block
                ctx.fillRect(cxWrapped + topOff, cy,     2,    8);
                // Left edge of mid block
                ctx.fillRect(cxWrapped,           cy + 8, 2,    16);
                // Left edge of bottom block
                ctx.fillRect(cxWrapped + botOff,  cy + 24, 2,   8);
            }

            // === FAR PARALLAX: City skyline ===
            const farP = 0.15;
            // Neon window palette — VA-11 HALL-A sparsity
            const neonWindowColors = ['#ff00ff', '#00ffff', '#ff00aa', '#aa00ff'];
            for (let bi2 = 0; bi2 < bgElements.buildings.length; bi2++) {
                const b = bgElements.buildings[bi2];
                const bx = b.x - cameraX * farP;
                if (bx + b.w < -100 || bx > canvas.width + 100) continue;

                // Building body — dark plum silhouette, clearly visible against sky
                ctx.fillStyle = '#150028';
                ctx.fillRect(bx, 520 - b.h, b.w, b.h);

                // Windows — one neon color per building, ~30% lit, 0.5–0.7 alpha
                const neonCol = neonWindowColors[bi2 % neonWindowColors.length];
                const wSpacing = b.w / (b.windows + 1);
                const rowH = b.h / (b.windowRows + 1);
                // Use a simple per-building deterministic pattern for lit windows
                const litSeed = (bi2 * 7 + 3) & 0xffff;
                for (let wy = 1; wy <= b.windowRows; wy++) {
                    for (let wx = 1; wx <= b.windows; wx++) {
                        // ~30% chance: use deterministic hash of indices
                        const hash = ((litSeed ^ (wy * 31) ^ (wx * 17)) * 2654435761) >>> 0;
                        if ((hash % 100) >= 30) continue;
                        const alpha = 0.5 + ((hash % 21) / 100); // 0.50–0.70
                        // Parse hex neon color into rgba
                        const r = parseInt(neonCol.slice(1, 3), 16);
                        const g2 = parseInt(neonCol.slice(3, 5), 16);
                        const bl = parseInt(neonCol.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${r},${g2},${bl},${alpha.toFixed(2)})`;
                        ctx.fillRect(bx + wx * wSpacing - 3, 520 - b.h + wy * rowH - 3, 6, 6);
                    }
                }

                // Neon sign — one per ~4–5 buildings (every 4th), 3–4px tall rect
                if (bi2 % 4 === 0) {
                    const signY = 520 - b.h + 12;
                    const signW = Math.min(b.w - 8, 28 + (bi2 % 3) * 8);
                    ctx.fillStyle = neonCol;
                    ctx.globalAlpha = 0.85;
                    ctx.fillRect(bx + 4, signY, signW, 3 + (bi2 % 2)); // 3–4px tall
                    ctx.globalAlpha = 1;
                }

                // Antenna
                if (b.hasAntenna) {
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(bx + b.w * 0.5, 520 - b.h);
                    ctx.lineTo(bx + b.w * 0.5, 520 - b.h - 30);
                    ctx.stroke();
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(bx + b.w * 0.5 - 2, 520 - b.h - 32, 4, 4);
                }

                // Water tower
                if (b.hasWaterTower) {
                    ctx.fillStyle = '#1a1a1a';
                    // legs
                    ctx.fillRect(bx + b.w * 0.3, 520 - b.h - 20, 3, 20);
                    ctx.fillRect(bx + b.w * 0.6, 520 - b.h - 20, 3, 20);
                    // tank
