                    ctx.fillRect(bx + b.w * 0.2, 520 - b.h - 35, b.w * 0.5, 16);
                }
            }

            // === HALDEN LANDMARKS (far parallax silhouettes) ===
            const landmarkP = 0.1;
            ctx.save();

            // --- Fredriksten Fortress silhouette (on a hill, left side) ---
            const fX = 600 - cameraX * landmarkP;
            ctx.fillStyle = '#0d0018';
            ctx.globalAlpha = 1.0;

            // Hill / mountain the fortress sits on
            ctx.beginPath();
            ctx.moveTo(fX - 200, 520);
            ctx.lineTo(fX - 160, 340);
            ctx.lineTo(fX - 100, 290);
            ctx.lineTo(fX - 40, 260);
            ctx.lineTo(fX + 40, 240);
            ctx.lineTo(fX + 120, 245);
            ctx.lineTo(fX + 200, 270);
            ctx.lineTo(fX + 260, 310);
            ctx.lineTo(fX + 320, 360);
            ctx.lineTo(fX + 360, 520);
            ctx.fill();

            // Fortress walls (star-fort angular walls)
            ctx.fillStyle = '#120020';
            // Main keep / tower
            ctx.fillRect(fX - 20, 180, 50, 62);
            // Keep roof (pointed)
            ctx.beginPath();
            ctx.moveTo(fX - 25, 180);
            ctx.lineTo(fX + 5, 150);
            ctx.lineTo(fX + 35, 180);
            ctx.fill();
            // Flag on top
            ctx.fillStyle = '#330044';
            ctx.fillRect(fX + 3, 120, 3, 32);
            ctx.fillRect(fX + 6, 122, 16, 10);

            // Outer fortress walls with bastions
            ctx.fillStyle = '#120020';
            // Left wall section
            ctx.beginPath();
            ctx.moveTo(fX - 100, 290);
            ctx.lineTo(fX - 100, 250);
            ctx.lineTo(fX - 80, 240);
            ctx.lineTo(fX - 80, 230);  // bastion point
            ctx.lineTo(fX - 60, 225);
            ctx.lineTo(fX - 40, 230);
            ctx.lineTo(fX - 40, 242);
            ctx.lineTo(fX - 20, 242);
            ctx.lineTo(fX - 20, 290);
            ctx.fill();

            // Right wall section
            ctx.beginPath();
            ctx.moveTo(fX + 30, 242);
            ctx.lineTo(fX + 50, 242);
            ctx.lineTo(fX + 50, 230);
            ctx.lineTo(fX + 70, 222);  // bastion point
            ctx.lineTo(fX + 90, 225);
            ctx.lineTo(fX + 110, 235);
            ctx.lineTo(fX + 110, 250);
            ctx.lineTo(fX + 120, 260);
            ctx.lineTo(fX + 120, 300);
            ctx.lineTo(fX + 30, 290);
            ctx.fill();

            // Lower curtain wall (front face)
            ctx.fillStyle = '#100018';
            ctx.beginPath();
            ctx.moveTo(fX - 120, 310);
            ctx.lineTo(fX - 120, 280);
            ctx.lineTo(fX - 90, 270);
            ctx.lineTo(fX - 70, 275);  // bastion notch
            ctx.lineTo(fX - 50, 265);
            ctx.lineTo(fX + 60, 260);
            ctx.lineTo(fX + 80, 265);
            ctx.lineTo(fX + 100, 260);  // bastion notch
            ctx.lineTo(fX + 130, 275);
            ctx.lineTo(fX + 140, 320);
            ctx.fill();

            // Small tower on the right
            ctx.fillStyle = '#120020';
            ctx.fillRect(fX + 100, 220, 20, 40);
            ctx.beginPath();
            ctx.moveTo(fX + 98, 220);
            ctx.lineTo(fX + 110, 208);
            ctx.lineTo(fX + 122, 220);
            ctx.fill();

            // --- Nexans Tower silhouette (tall industrial chimney, right side) ---
            const nX = 2800 - cameraX * landmarkP;

            // The tall tower/chimney
            ctx.fillStyle = '#0d0018';
            ctx.globalAlpha = 1.0;

            // Main tower shaft (tall and narrow)
            ctx.fillRect(nX - 12, 120, 24, 400);

            // Slight taper at top
            ctx.beginPath();
            ctx.moveTo(nX - 14, 140);
            ctx.lineTo(nX - 10, 100);
            ctx.lineTo(nX + 10, 100);
            ctx.lineTo(nX + 14, 140);
            ctx.fill();

            // Top cap / observation platform
            ctx.fillRect(nX - 20, 100, 40, 12);
            ctx.fillRect(nX - 16, 90, 32, 12);

            // Ring details on the shaft
            ctx.fillStyle = '#150024';
            ctx.fillRect(nX - 15, 200, 30, 5);
            ctx.fillRect(nX - 15, 300, 30, 5);
            ctx.fillRect(nX - 15, 400, 30, 5);

            // Base / factory building around the tower
            ctx.fillStyle = '#0d0018';
            ctx.globalAlpha = 1.0;
            ctx.fillRect(nX - 80, 420, 160, 100);
            ctx.fillRect(nX - 100, 450, 200, 70);

            // Factory roof angles
            ctx.beginPath();
            ctx.moveTo(nX - 100, 450);
            ctx.lineTo(nX - 80, 420);
            ctx.lineTo(nX - 40, 410);
            ctx.lineTo(nX, 420);
            ctx.lineTo(nX + 40, 410);
            ctx.lineTo(nX + 80, 420);
            ctx.lineTo(nX + 100, 450);
            ctx.fill();

            // Small factory windows
            ctx.fillStyle = 'rgba(255, 200, 50, 0.08)';
            for (let fy = 0; fy < 2; fy++) {
                for (let fx = 0; fx < 5; fx++) {
                    ctx.fillRect(nX - 70 + fx * 30, 460 + fy * 25, 12, 10);
                }
            }

            // Smoke wisps from the tower top
            ctx.globalAlpha = 0.12;
            ctx.fillStyle = '#442266';
            const smokeT = Date.now() / 2000;
            for (let s = 0; s < 4; s++) {
                const sx = nX + Math.sin(smokeT + s * 1.5) * (15 + s * 10);
                const sy = 80 - s * 25;
                const sr = 12 + s * 10;
                ctx.beginPath();
                ctx.ellipse(sx, sy, sr, sr * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.globalAlpha = 1;
            ctx.restore();

            // === MID PARALLAX: Background wall / fence texture ===
            const midP = 0.4;

            // Concrete wall strip behind playground
            ctx.fillStyle = '#1a1520';
            ctx.fillRect(0, 340, canvas.width, 180);

            // Wall stains
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            for (let i = 0; i < 6; i++) {
                const sx = (i * 300 - cameraX * midP) % (canvas.width + 200);
                ctx.beginPath();
                ctx.ellipse(sx, 420, 40 + i * 8, 60, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Torn posters on the wall
            for (let p of bgElements.posters) {
                const px = p.x - cameraX * midP;
                if (px + p.w < -50 || px > canvas.width + 50) continue;

                ctx.fillStyle = p.color;
                if (p.torn) {
                    ctx.fillRect(px, p.y, p.w, p.h * (1 - p.tornAmount));
                    // torn edge
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = 0.5;
                    ctx.fillRect(px + 2, p.y + p.h * (1 - p.tornAmount), p.w * 0.6, p.h * p.tornAmount * 0.5);
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillRect(px, p.y, p.w, p.h);
                }

                // Poster text placeholder (lines)
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                for (let l = 0; l < 3; l++) {
                    ctx.fillRect(px + 4, p.y + 6 + l * 8, p.w - 8, 3);
                }
            }

            // Chain-link fences
            for (let f of bgElements.fences) {
                const fx = f.x - cameraX * midP;
                if (fx + f.w < -50 || fx > canvas.width + 50) continue;

                ctx.strokeStyle = 'rgba(100, 100, 120, 0.4)';
                ctx.lineWidth = 1;
                // Diamond pattern
                const spacing = 12;
                for (let dy = 340; dy < 520; dy += spacing) {
                    for (let dx = fx; dx < fx + f.w; dx += spacing) {
                        ctx.beginPath();
                        ctx.moveTo(dx, dy);
                        ctx.lineTo(dx + spacing / 2, dy + spacing / 2);
                        ctx.lineTo(dx + spacing, dy);
                        ctx.stroke();
                    }
                }

                // Fence posts
                ctx.fillStyle = '#444';
                for (let fp = fx; fp < fx + f.w; fp += 80) {
                    ctx.fillRect(fp, 330, 6, 190);
                }
            }

            // Graffiti tags — faded neons (alpha baked into rgba color strings)
            for (let g of bgElements.graffiti) {
                const gx = g.x - cameraX * (g.onGround ? 1 : midP);
                if (gx < -100 || gx > canvas.width + 100) continue;

                ctx.save();
                ctx.translate(gx, g.onGround ? 515 : g.y);
                ctx.rotate(g.rotation);
                ctx.font = `bold ${g.size}px 'Press Start 2P', monospace`;
                ctx.fillStyle = g.color;
                // Alpha is baked into the rgba color; use globalAlpha=1 so it isn't dimmed further
                ctx.globalAlpha = g.onGround ? 0.5 : 1;
                ctx.fillText(g.text, 0, 0);

                // Spray drip effect
                if (!g.onGround && g.size > 20) {
                    ctx.fillStyle = g.color;
                    ctx.globalAlpha = 0.5;
                    for (let d = 0; d < 3; d++) {
                        const dripX = d * g.size * 0.4;
                        ctx.fillRect(dripX, 4, 3, 8 + d * 6);
                    }
                }
                ctx.globalAlpha = 1;
                ctx.restore();
            }

            // === FOREGROUND PARALLAX (moves with level) ===

            // Ground cracks
            ctx.strokeStyle = 'rgba(40, 20, 30, 0.6)';
            ctx.lineWidth = 2;
            for (let c of bgElements.cracks) {
                const cx = c.x - cameraX;
                if (cx < -80 || cx > canvas.width + 80) continue;
                for (let branch of c.branches) {
                    ctx.beginPath();
                    ctx.moveTo(cx, 522);
                    ctx.lineTo(cx + branch.dx, 522 + branch.dy);
                    ctx.stroke();
                }
            }

            // Puddles
            for (let p of bgElements.puddles) {
                const px = p.x - cameraX;
                if (px + p.w < -10 || px > canvas.width + 10) continue;

                if (p.oily) {
                    // Oil rainbow puddle
                    const oilGrad = ctx.createLinearGradient(px, 0, px + p.w, 0);
                    oilGrad.addColorStop(0, 'rgba(80, 0, 120, 0.4)');
                    oilGrad.addColorStop(0.3, 'rgba(0, 80, 120, 0.3)');
                    oilGrad.addColorStop(0.6, 'rgba(120, 80, 0, 0.3)');
                    oilGrad.addColorStop(1, 'rgba(80, 0, 80, 0.4)');
                    ctx.fillStyle = oilGrad;
                } else {
                    ctx.fillStyle = 'rgba(30, 20, 50, 0.5)';
                }
                ctx.beginPath();
                ctx.ellipse(px + p.w / 2, 522, p.w / 2, p.h / 2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Magenta reflection stripe — 2px horizontal bar across puddle center
                ctx.fillStyle = 'rgba(255,0,255,0.25)';
                ctx.fillRect(px, 521, p.w, 2);
            }

            // === GUTTER LINE — 2px cyan at exactly groundY (520) ===
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(0, level.groundY, canvas.width, 2);

            // Trash cans
            for (let t of bgElements.trashCans) {
                const tx = t.x - cameraX;
                if (tx < -60 || tx > canvas.width + 60) continue;

                if (t.tipped) {
                    // Tipped over trash can
                    ctx.fillStyle = '#555';
                    ctx.save();
                    ctx.translate(tx, 510);
                    ctx.rotate(1.3);
                    ctx.fillRect(-12, -20, 24, 36);
                    ctx.restore();
                    // Spilled trash
                    ctx.fillStyle = '#3a3a2a';
                    ctx.fillRect(tx + 10, 510, 30, 8);
                    ctx.fillStyle = '#886633';
                    ctx.fillRect(tx + 15, 506, 12, 6);
                    ctx.fillStyle = '#448844';
                    ctx.fillRect(tx + 30, 508, 8, 8);
                } else {
                    // Standing trash can
                    ctx.fillStyle = '#555';
                    ctx.fillRect(tx - 14, 484, 28, 36);
                    ctx.fillStyle = '#666';
                    ctx.fillRect(tx - 16, 480, 32, 8);

                    if (t.overflowing) {
                        // Trash poking out the top
                        ctx.fillStyle = '#886633';
                        ctx.fillRect(tx - 8, 472, 16, 12);
                        ctx.fillStyle = '#448844';
                        ctx.fillRect(tx - 4, 468, 10, 8);
                        ctx.fillStyle = '#cc9933';
                        ctx.fillRect(tx + 6, 474, 8, 6);
                    }
                }
            }

            // Litter on the ground
            for (let l of bgElements.litter) {
                const lx = l.x - cameraX;
                if (lx < -20 || lx > canvas.width + 20) continue;

                ctx.save();
                ctx.translate(lx, l.y);
                ctx.rotate(l.rotation);
                ctx.globalAlpha = 0.7;

                if (l.type === 'can') {
                    ctx.fillStyle = '#cc3333';
                    ctx.fillRect(-5, -3, 10, 6);
                    ctx.fillStyle = '#999';
                    ctx.fillRect(-5, -3, 10, 2);
                } else if (l.type === 'bottle') {
                    ctx.fillStyle = 'rgba(100, 200, 100, 0.5)';
                    ctx.fillRect(-3, -6, 6, 12);
                    ctx.fillRect(-1, -9, 2, 4);
                } else if (l.type === 'bag') {
                    ctx.fillStyle = '#ddd';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 8, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (l.type === 'paper') {
                    ctx.fillStyle = '#eeddcc';
                    ctx.fillRect(-6, -4, 12, 8);
                } else if (l.type === 'cigarette') {
                    ctx.fillStyle = '#eee';
                    ctx.fillRect(-6, -1, 10, 2);
                    ctx.fillStyle = '#cc8833';
                    ctx.fillRect(-6, -1, 3, 2);
                } else if (l.type === 'wrapper') {
                    ctx.fillStyle = l.color;
                    ctx.fillRect(-5, -3, 10, 6);
                } else if (l.type === 'needle') {
                    ctx.strokeStyle = '#aaa';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(-6, 0);
                    ctx.lineTo(6, 0);
                    ctx.stroke();
                    ctx.fillStyle = '#ff6600';
                    ctx.fillRect(-8, -2, 4, 4);
                }

                ctx.globalAlpha = 1;
                ctx.restore();
            }

            // Homeless people
            for (let h of bgElements.homeless) {
                const hx = h.x - cameraX;
                if (hx < -80 || hx > canvas.width + 80) continue;

                ctx.save();
                ctx.translate(hx, h.y);

                if (h.sitting) {
                    // Sitting against wall
                    // Body
                    ctx.fillStyle = '#3a3028';
                    ctx.fillRect(-12, -50, 24, 40);
                    // Legs out
                    ctx.fillStyle = '#2a2820';
                    ctx.fillRect(-8, -14, 36, 12);
                    // Head
                    ctx.fillStyle = h.skinTone;
                    ctx.beginPath();
                    ctx.arc(0, -58, 12, 0, Math.PI * 2);
                    ctx.fill();
                    // Beanie/hat
                    ctx.fillStyle = h.hatColor;
                    ctx.fillRect(-13, -72, 26, 14);

                    // Blanket
                    if (h.hasBlanket) {
                        ctx.fillStyle = h.blanketColor;
                        ctx.fillRect(-16, -30, 40, 22);
                    }

                    // Cardboard sign
                    if (h.hasSign) {
                        ctx.fillStyle = '#8B7355';
                        ctx.fillRect(20, -35, 40, 25);
                        ctx.fillStyle = '#222';
                        ctx.font = '6px monospace';
                        ctx.fillText(h.signText, 23, -18);
                    }

                    // Bottle next to them
                    if (h.hasBottle) {
                        ctx.fillStyle = '#553311';
                        ctx.fillRect(30, -12, 5, 12);
                        ctx.fillRect(31, -16, 3, 5);
                    }

                    // ZZZ if sleeping
                    if (h.zzz) {
                        ctx.fillStyle = '#aaaaff';
                        ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 800) * 0.3;
                        ctx.font = '10px Press Start 2P';
                        ctx.fillText('z', 10, -72);
                        ctx.font = '14px Press Start 2P';
                        ctx.fillText('z', 20, -82);
                        ctx.font = '18px Press Start 2P';
                        ctx.fillText('z', 32, -94);
                        ctx.globalAlpha = 1;
                    }
                } else {
                    // Lying down
                    ctx.fillStyle = '#3a3028';
                    ctx.fillRect(-30, -14, 60, 14);
                    // Head
                    ctx.fillStyle = h.skinTone;
                    ctx.beginPath();
                    ctx.arc(-30, -14, 10, 0, Math.PI * 2);
                    ctx.fill();
                    // Blanket over body
                    if (h.hasBlanket) {
                        ctx.fillStyle = h.blanketColor;
                        ctx.fillRect(-18, -16, 48, 14);
                    }

                    // ZZZ
                    if (h.zzz) {
                        ctx.fillStyle = '#aaaaff';
                        ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 800) * 0.3;
                        ctx.font = '10px Press Start 2P';
                        ctx.fillText('z', -25, -30);
                        ctx.font = '14px Press Start 2P';
                        ctx.fillText('z', -15, -42);
                        ctx.globalAlpha = 1;
                    }
                }

                // Shopping cart
                if (h.hasCart) {
                    const cartX = h.sitting ? -50 : 40;
                    ctx.strokeStyle = '#888';
                    ctx.lineWidth = 2;
                    // Cart frame
                    ctx.strokeRect(cartX, -40, 30, 25);
                    // Wheels
                    ctx.fillStyle = '#555';
                    ctx.beginPath();
                    ctx.arc(cartX + 5, -12, 4, 0, Math.PI * 2);
                    ctx.arc(cartX + 25, -12, 4, 0, Math.PI * 2);
                    ctx.fill();
                    // Stuff in cart
                    ctx.fillStyle = '#554433';
                    ctx.fillRect(cartX + 3, -42, 24, 8);
                    ctx.fillStyle = '#336633';
                    ctx.fillRect(cartX + 8, -48, 14, 8);
                }

                ctx.restore();
            }

            // === Playground elements (static, world-space) ===

            // Jungle gym — #00ffff bars with #ffffff 1px inner highlight
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 14;
            ctx.beginPath();
            ctx.moveTo(620 - cameraX, 380);
            ctx.lineTo(880 - cameraX, 380);
            ctx.moveTo(620 - cameraX, 380);
            ctx.lineTo(620 - cameraX, 520);
            ctx.moveTo(880 - cameraX, 380);
            ctx.lineTo(880 - cameraX, 520);
            ctx.stroke();
            // White inner highlight (1px line on top of the cyan stroke)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(620 - cameraX, 380);
            ctx.lineTo(880 - cameraX, 380);
            ctx.moveTo(620 - cameraX, 380);
            ctx.lineTo(620 - cameraX, 520);
            ctx.moveTo(880 - cameraX, 380);
            ctx.lineTo(880 - cameraX, 520);
            ctx.stroke();
            // Cross bars — cyan
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(620 - cameraX, 420);
            ctx.lineTo(880 - cameraX, 420);
            ctx.moveTo(620 - cameraX, 460);
            ctx.lineTo(880 - cameraX, 460);
            ctx.stroke();
            // Cross bar highlights
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(620 - cameraX, 420);
            ctx.lineTo(880 - cameraX, 420);
            ctx.moveTo(620 - cameraX, 460);
            ctx.lineTo(880 - cameraX, 460);
            ctx.stroke();

            // Slide (worn, graffitied)
            ctx.fillStyle = '#882288';
            ctx.fillRect(1650 - cameraX, 300, 40, 220);
            ctx.fillStyle = '#557788';
            ctx.fillRect(1690 - cameraX, 300, 140, 30);
            // Slide surface (scratched)
            ctx.fillStyle = '#446677';
            ctx.beginPath();
            ctx.moveTo(1690 - cameraX, 330);
            ctx.lineTo(1830 - cameraX, 520);
            ctx.lineTo(1690 - cameraX, 520);
            ctx.fill();
            // Graffiti on slide support
            ctx.fillStyle = '#ff00ff';
            ctx.globalAlpha = 0.5;
            ctx.font = 'bold 12px monospace';
            ctx.fillText('SASS', 1655 - cameraX, 400);
            ctx.globalAlpha = 1;


            // Street lamp (flickering)
            const lampFlicker = Math.sin(Date.now() / 100) > 0.3 ? 1 : 0.2;
            for (let lx of [500, 1400, 2500, 3400]) {
                const lampX = lx - cameraX;
                if (lampX < -40 || lampX > canvas.width + 40) continue;
                // Pole
                ctx.fillStyle = '#333';
                ctx.fillRect(lampX - 3, 320, 6, 200);
                // Arm
                ctx.fillRect(lampX - 3, 320, 30, 4);
                // Light
                ctx.fillStyle = `rgba(255, 200, 100, ${0.15 * lampFlicker})`;
                ctx.beginPath();
                ctx.moveTo(lampX + 27, 324);
                ctx.lineTo(lampX - 30, 520);
                ctx.lineTo(lampX + 84, 520);
                ctx.fill();
                // Bulb
                ctx.fillStyle = `rgba(255, 220, 120, ${0.8 * lampFlicker})`;
                ctx.fillRect(lampX + 22, 322, 10, 8);
            }
        }

        // ========================================================
        // LEVEL 2 — SKOFABRIKKEN BACKGROUND
        // ========================================================
        function drawSkofabrikkenBackground() {
            const camX = cameraX;
            const W = canvas.width;
            const H = canvas.height;
            const groundY = level.groundY;
            const t = Date.now();

            // ── SKY ───────────────────────────────────────────────────────────────
            const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0,   '#1a5a9a');
            skyGrad.addColorStop(0.5, '#4a90d0');
            skyGrad.addColorStop(1,   '#8ec8f0');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, groundY);

            // ── CLOUDS (parallax 0.1x) ────────────────────────────────────────────
            for (const cl of bgElements.clouds) {
                const wrap = LEVEL_WIDTH + 400;
                const cx = ((cl.x - camX * 0.1) % wrap + wrap) % wrap - 200;
                if (cx < -300 || cx > W + 300) continue;
                const cw = cl.w, cy = cl.y;
                ctx.fillStyle = '#e0eaf4';
                ctx.fillRect(cx, cy, cw, 14);
                ctx.fillRect(cx + Math.floor(cw * 0.15), cy - 10, Math.floor(cw * 0.7), 10);
                ctx.fillRect(cx + Math.floor(cw * 0.3),  cy - 18, Math.floor(cw * 0.4), 8);
                ctx.fillStyle = '#c8d8e8';
                ctx.fillRect(cx, cy + 14, cw, 4);
            }

            // ── FAR URBAN ROOFLINE (parallax 0.15x) ──────────────────────────────
            const r0off = -camX * 0.15;
            const roofBuildings = [
                {x:0,    w:200, h:60}, {x:220,  w:150, h:80}, {x:390,  w:180, h:50},
                {x:590,  w:220, h:90}, {x:830,  w:160, h:65}, {x:1010, w:200, h:70},
                {x:1230, w:180, h:55}, {x:1430, w:220, h:85}, {x:1670, w:160, h:60},
                {x:1860, w:190, h:72}, {x:2080, w:210, h:58}, {x:2310, w:170, h:68},
            ];
            for (const rb of roofBuildings) {
                const bx = rb.x + r0off;
                ctx.fillStyle = '#585868';
                ctx.fillRect(bx, groundY - rb.h - 90, rb.w, rb.h + 10);
                ctx.fillStyle = 'rgba(170,195,220,0.35)';
                for (let wy = 10; wy < rb.h - 10; wy += 20) {
                    for (let wx = 10; wx < rb.w - 10; wx += 22) {
                        ctx.fillRect(bx + wx, groundY - rb.h - 90 + wy, 10, 12);
                    }
                }
            }

            // ── SKOFABRIKKEN BUILDING (parallax 0.3x) ────────────────────────────
            // Wide enough to cover screen at max camera scroll (2520 * 0.3 = 756px shift)
            const TOTAL_BLD_W = 2450;
            const bldOff = -camX * 0.3;
            const bldX   = bldOff;
            const bldTop  = 55;
            const bldH    = groundY - bldTop - 80;

            const leftWingW  = Math.floor(TOTAL_BLD_W * 0.38);   // ~930px
            const entrW      = Math.floor(TOTAL_BLD_W * 0.24);   // ~588px
            const rightWingW = TOTAL_BLD_W - leftWingW - entrW;  // remainder
            const entrX      = bldX + leftWingW;
            const rightWingX = entrX + entrW;

            // Per-brick deterministic color variation
            function brickColor(row, col) {
                const h = ((row * 17 + col * 31 + row * col * 7) & 0xff);
                if      (h < 55)  return '#cc5c2e';
                else if (h < 115) return '#b84820';
                else if (h < 185) return '#a83a18';
                else              return '#d8663a';
            }

            function drawBrickWing(wx, ww, wh) {
                // Mortar base
                ctx.fillStyle = '#6a2808';
                ctx.fillRect(wx, bldTop, ww, wh);
                // Brick rows (8px tall, 15px wide)
                for (let row = 0; row * 8 < wh; row++) {
                    const offset = (row % 2) * 7;
                    for (let col = -1; col * 15 < ww + 15; col++) {
                        const brickX = wx + col * 15 + offset;
                        const brickY = bldTop + row * 8;
                        if (brickX + 15 < wx || brickX > wx + ww) continue;
                        ctx.fillStyle = brickColor(row, col);
                        ctx.fillRect(brickX + 1, brickY + 1, 13, 6);
                    }
                }
                // Wing windows — adapt column count to wing width
                const colCount = Math.max(2, Math.floor(ww / 85));
                const colGap   = Math.floor(ww / colCount);
                for (let wrow = 0; wrow < 3; wrow++) {
                    for (let wcol = 0; wcol < colCount; wcol++) {
                        const wxi = wx + wcol * colGap + 12;
                        const wyi = bldTop + 22 + wrow * 72;
                        const wwi = colGap - 24;
                        const whi = 54;
                        if (wwi < 8) continue;
                        // Glass
                        ctx.fillStyle = 'rgba(138,188,220,0.68)';
                        ctx.fillRect(wxi, wyi, wwi, whi);
                        // Dark frame
                        ctx.strokeStyle = '#1a2d3f';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(wxi, wyi, wwi, whi);
                        // Cross dividers
                        ctx.beginPath();
                        ctx.moveTo(wxi + Math.floor(wwi / 2), wyi);
                        ctx.lineTo(wxi + Math.floor(wwi / 2), wyi + whi);
                        ctx.moveTo(wxi, wyi + Math.floor(whi / 2));
                        ctx.lineTo(wxi + wwi, wyi + Math.floor(whi / 2));
                        ctx.stroke();
                        // Reflection shimmer
                        ctx.fillStyle = 'rgba(215,240,255,0.22)';
                        ctx.fillRect(wxi + 2, wyi + 2, 5, whi - 4);
                    }
                }
            }

            drawBrickWing(bldX, leftWingW, bldH);
            drawBrickWing(rightWingX, rightWingW, bldH);

            // ── GLASS CURTAIN-WALL ENTRANCE ───────────────────────────────────────
            // Base glass fill
            ctx.fillStyle = 'rgba(148,200,230,0.38)';
            ctx.fillRect(entrX, bldTop, entrW, bldH);

            // Curtain wall grid — panels, then mullions on top
            const mullionW  = 5;
            const colStep   = 38;
            const rowStep   = 48;
            const panelGlass = 'rgba(158,208,238,0.58)';
            for (let col = 0; col < entrW; col += colStep) {
                for (let row = 0; row < bldH; row += rowStep) {
                    const px = entrX + col + mullionW;
                    const py = bldTop + row + mullionW;
                    const pw = colStep - mullionW;
                    const ph = rowStep - mullionW;
                    if (pw < 2 || ph < 2) continue;
                    ctx.fillStyle = panelGlass;
                    ctx.fillRect(px, py, pw, ph);
                    // Panel inner reflection
                    ctx.fillStyle = 'rgba(225,248,255,0.14)';
                    ctx.fillRect(px + 2, py + 2, 7, ph - 4);
                }
            }
            // Vertical mullions
            ctx.fillStyle = '#3d5da0';
            for (let col = 0; col <= entrW; col += colStep) {
                ctx.fillRect(entrX + col - Math.floor(mullionW / 2), bldTop, mullionW, bldH);
            }
            // Horizontal transoms
            for (let row = 0; row <= bldH; row += rowStep) {
                ctx.fillRect(entrX, bldTop + row - Math.floor(mullionW / 2), entrW, mullionW);
            }
            // Mullion highlight strip (left edge of each)
            ctx.fillStyle = '#6080c8';
            for (let col = 0; col <= entrW; col += colStep) {
                ctx.fillRect(entrX + col - Math.floor(mullionW / 2), bldTop, 2, bldH);
            }
            // Wide diagonal reflection sweep
            ctx.fillStyle = 'rgba(210,240,255,0.07)';
            ctx.beginPath();
            ctx.moveTo(entrX + 15,       bldTop);
            ctx.lineTo(entrX + 90,       bldTop);
            ctx.lineTo(entrX + 55,       bldTop + bldH);
            ctx.lineTo(entrX - 20,       bldTop + bldH);
            ctx.closePath();
            ctx.fill();

            // ── CURVED ARCH over entrance ─────────────────────────────────────────
            ctx.fillStyle = '#2e4888';
            ctx.beginPath();
            ctx.moveTo(entrX, bldTop);
            ctx.lineTo(entrX + entrW, bldTop);
            ctx.quadraticCurveTo(entrX + entrW / 2, bldTop - 34, entrX, bldTop);
            ctx.closePath();
            ctx.fill();
            // Arch highlight
            ctx.strokeStyle = '#5577c0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(entrX + 18, bldTop - 2);
            ctx.quadraticCurveTo(entrX + entrW / 2, bldTop - 26, entrX + entrW - 18, bldTop - 2);
            ctx.stroke();

            // ── SKOFABRIKKEN SIGN ─────────────────────────────────────────────────
            ctx.shadowColor = 'rgba(180,210,255,0.6)';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#eeeeff';
            ctx.font = 'bold 14px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('SKOFABRIKKEN', entrX + Math.floor(entrW / 2), bldTop + 28);
            ctx.shadowBlur = 0;
            ctx.font = '8px "Press Start 2P", monospace';
            ctx.fillStyle = 'rgba(195,218,255,0.75)';
            ctx.fillText('HANDELSENTER', entrX + Math.floor(entrW / 2), bldTop + 44);
            ctx.textAlign = 'left';

            // ── ROOFLINE parapet ──────────────────────────────────────────────────
            ctx.fillStyle = '#242432';
            ctx.fillRect(bldX, bldTop - 18, TOTAL_BLD_W, 18);
            // Cornice overhang
            ctx.fillStyle = '#16161e';
            ctx.fillRect(bldX - 5, bldTop - 24, TOTAL_BLD_W + 10, 8);
            // Cornice highlight edge
            ctx.fillStyle = '#3a3a50';
            ctx.fillRect(bldX - 5, bldTop - 24, TOTAL_BLD_W + 10, 2);

            // ── ENTRANCE DOORS ────────────────────────────────────────────────────
            const doorW  = 30, doorH = 72;
            const doorY  = groundY - doorH - 8;
            const doorMid = entrX + Math.floor(entrW / 2);
            ctx.fillStyle = 'rgba(185,218,238,0.88)';
            ctx.fillRect(doorMid - doorW - 5, doorY, doorW, doorH);
            ctx.fillRect(doorMid + 5,         doorY, doorW, doorH);
            ctx.strokeStyle = '#3d5da0';
            ctx.lineWidth = 2;
            ctx.strokeRect(doorMid - doorW - 5, doorY, doorW, doorH);
            ctx.strokeRect(doorMid + 5,         doorY, doorW, doorH);
            // Door handles
            ctx.fillStyle = '#c8a020';
            ctx.fillRect(doorMid - 8,  doorY + 34, 4, 8);
            ctx.fillRect(doorMid + 4,  doorY + 34, 4, 8);

            // ── TREES with planters (parallax 0.5x) ──────────────────────────────
            const treeOff = -camX * 0.5;
            const treePosArr = [200, 420, 640, 900, 1150, 1420, 1700, 1980, 2260, 2540, 2820, 3100];
            for (const tp of treePosArr) {
                const tx = tp + treeOff;
                if (tx < -130 || tx > W + 130) continue;
                const ty = groundY - 8;
                // Planter box
                ctx.fillStyle = '#888876';
                ctx.fillRect(tx - 22, ty - 22, 44, 22);
                ctx.fillStyle = '#666656';
                ctx.fillRect(tx - 24, ty - 25, 48, 5);
                // Dirt
                ctx.fillStyle = '#5a3a18';
                ctx.fillRect(tx - 18, ty - 20, 36, 10);
                // Trunk
                ctx.fillStyle = '#6a4020';
                ctx.fillRect(tx - 6, ty - 88, 12, 66);
                // Canopy layers
                ctx.fillStyle = '#1e5010';
                ctx.beginPath(); ctx.arc(tx, ty - 118, 34, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#2e6e1c';
                ctx.beginPath(); ctx.arc(tx - 10, ty - 128, 27, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#3e8828';
                ctx.beginPath(); ctx.arc(tx + 8,  ty - 125, 23, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#50a030';
                ctx.beginPath(); ctx.arc(tx - 3,  ty - 136, 16, 0, Math.PI * 2); ctx.fill();
                // Highlight
                ctx.fillStyle = '#70c048';
                ctx.beginPath(); ctx.arc(tx - 6, ty - 143, 9, 0, Math.PI * 2); ctx.fill();
            }

            // ── NYE VARER neon sign (pulsing magenta) ─────────────────────────────
            const pulse = 0.72 + 0.28 * Math.sin(t * 0.0042);
            const signX = entrX + Math.floor(entrW * 0.08);
            const signY = bldTop + bldH - 62;
            ctx.shadowColor = '#ff00ff';
            ctx.shadowBlur  = Math.floor(22 * pulse);
            ctx.fillStyle = `rgba(60,0,60,${0.85 * pulse})`;
            ctx.fillRect(signX - 4, signY - 4, 158, 36);
            ctx.fillStyle = `rgba(255,0,255,${pulse})`;
            ctx.fillRect(signX, signY, 150, 28);
            ctx.shadowBlur = Math.floor(28 * pulse);
            ctx.fillStyle = `rgba(255,230,255,${0.95 * pulse})`;
            ctx.font = 'bold 10px "Press Start 2P", monospace';
            ctx.fillText('NYE VARER!', signX + 9, signY + 19);
            ctx.shadowBlur = 0;

            // ── REFLECTIVE BOLLARDS ───────────────────────────────────────────────
            const bollardXArr = [
                bldX + leftWingW * 0.15,
                entrX - 70, entrX - 38,
                entrX + entrW + 38, entrX + entrW + 70,
                rightWingX + rightWingW * 0.85,
            ];
            for (const bpos of bollardXArr) {
                const bx2 = bpos, by2 = groundY - 26;
                ctx.fillStyle = '#1c2e50';
                ctx.fillRect(bx2 - 5, by2, 10, 24);
                ctx.beginPath();
                ctx.arc(bx2, by2, 5, Math.PI, 0);
                ctx.fill();
                // Reflective band
                ctx.fillStyle = '#3a5a88';
                ctx.fillRect(bx2 - 5, by2 + 7, 10, 3);
                // Top shine
                ctx.fillStyle = '#5578b0';
                ctx.beginPath();
                ctx.arc(bx2 - 1, by2 - 2, 2, Math.PI, 0);
                ctx.fill();
            }

            // ── GUTTER LINE ───────────────────────────────────────────────────────
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(0, groundY, W, 1);
        }

        function drawSkofabrikkenGround() {
            const groundY = level.groundY;
            const W = canvas.width;

            // Paving slab base
            ctx.fillStyle = '#c0bdb0';
            ctx.fillRect(0, groundY, W, canvas.height - groundY);

            // Slab grid
            ctx.strokeStyle = '#9a9890';
            ctx.lineWidth = 1;
            const slabSize = 80;
            for (let sx = ((-cameraX) % slabSize + slabSize) % slabSize; sx < W; sx += slabSize) {
                ctx.beginPath();
                ctx.moveTo(sx, groundY);
                ctx.lineTo(sx, canvas.height);
                ctx.stroke();
            }
            for (let sy = groundY; sy < canvas.height; sy += slabSize) {
                ctx.beginPath();
                ctx.moveTo(0, sy);
                ctx.lineTo(W, sy);
                ctx.stroke();
            }

            // Surface texture lines
            ctx.strokeStyle = '#aaa8a0';
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.4;
            for (let ty = groundY + 20; ty < groundY + 60; ty += 18) {
                ctx.beginPath();
                ctx.moveTo(0, ty);
                ctx.lineTo(W, ty);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // Random chewing gum / scuffs
            ctx.fillStyle = '#444440';
            const seed2 = 12345;
            for (let i = 0; i < 20; i++) {
                const gx = ((seed2 * (i + 1) * 37 + 500) % (LEVEL_WIDTH)) - cameraX;
                if (gx < 0 || gx > W) continue;
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.ellipse(gx, groundY + 8 + (i % 3) * 10, 4, 2, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // ========================================================
        // LEVEL 3 — STRANDA TRIMPARK BACKGROUND
        // ========================================================
        function drawTrimparkBackground() {
            const camX = cameraX;
            const W = canvas.width;
            const groundY = level.groundY;

            // Sky gradient — bright outdoor blue
            const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0, '#3a8fc8');
            skyGrad.addColorStop(1, '#85c8f0');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, groundY);

            // Large fluffy pixel clouds
            for (let cl of bgElements.clouds) {
                const cx = ((cl.x - camX * 0.1) % (LEVEL_WIDTH + 200)) - 100;
                if (cx < -200 || cx > W + 200) continue;
                const cw = cl.w * 1.4;
                const cy = cl.y;
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(cx, cy, cw, 18);
                ctx.fillRect(cx + cw * 0.1, cy - 14, cw * 0.8, 14);
                ctx.fillRect(cx + cw * 0.2, cy - 24, cw * 0.6, 10);
                ctx.fillRect(cx + cw * 0.35, cy - 32, cw * 0.3, 8);
                ctx.fillStyle = '#d8d8d8';
                ctx.fillRect(cx, cy + 18, cw, 4);
            }

            // Tree canopy (parallax 0.15x) — dense summer green
            const treeOff = -camX * 0.15;
            const treeSeeds = [
                {x:0, w:180}, {x:160, w:140}, {x:280, w:200}, {x:460, w:160},
                {x:600, w:180}, {x:760, w:220}, {x:960, w:160}, {x:1100, w:200},
                {x:1280, w:180}, {x:1440, w:160}, {x:1580, w:240}, {x:1800, w:180},
                {x:1960, w:200}, {x:2140, w:160}, {x:2280, w:220}, {x:2480, w:180},
                {x:2640, w:160}, {x:2780, w:200}, {x:2960, w:220}, {x:3160, w:180},
                {x:3320, w:200}, {x:3500, w:160},
            ];
            for (let tr of treeSeeds) {
                const tx = tr.x + treeOff;
                if (tx + tr.w < -100 || tx > W + 100) continue;
                const trunkX = tx + tr.w / 2;
                // Trunk
                ctx.fillStyle = '#3a2010';
                ctx.fillRect(trunkX - 5, 310, 10, 100);
                // Canopy layers
                ctx.fillStyle = '#2a5520';
                ctx.beginPath();
                ctx.arc(trunkX, 240, tr.w * 0.55, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3a7a28';
                ctx.beginPath();
                ctx.arc(trunkX - tr.w * 0.15, 220, tr.w * 0.45, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(trunkX + tr.w * 0.15, 230, tr.w * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#5aaa38';
                ctx.beginPath();
                ctx.arc(trunkX, 200, tr.w * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Fence (parallax 0.35x)
            const fOff = -camX * 0.35;
            ctx.fillStyle = '#4a3820';
            ctx.fillRect(0, 318, W, 6);
            for (let fi = 0; fi < LEVEL_WIDTH; fi += 60) {
                const fx = fi + fOff;
                if (fx < -10 || fx > W + 10) continue;
                ctx.fillRect(fx, 300, 5, 26);
            }

            // Orange fitness equipment bg decorations (parallax 0.5x)
            const eqOff = -camX * 0.5;
            const eqStations = [
                {x: 300, type: 'pullup'}, {x: 800, type: 'dip'},
                {x: 1300, type: 'bar'}, {x: 1800, type: 'pullup'},
                {x: 2300, type: 'dip'}, {x: 2800, type: 'bar'},
                {x: 3400, type: 'pullup'},
            ];
            for (let eq of eqStations) {
                const ex = eq.x + eqOff;
                if (ex < -150 || ex > W + 150) continue;
                ctx.fillStyle = '#c85020';
                if (eq.type === 'pullup') {
                    // Two posts + crossbar
                    ctx.fillRect(ex - 30, 350, 8, 130);
                    ctx.fillRect(ex + 22, 350, 8, 130);
                    ctx.fillRect(ex - 32, 348, 64, 10);
                    // Highlight
                    ctx.fillStyle = '#e87040';
                    ctx.fillRect(ex - 30, 350, 3, 130);
                    ctx.fillRect(ex + 22, 350, 3, 80);
                } else if (eq.type === 'dip') {
                    // Dip station frame
                    ctx.fillRect(ex - 20, 360, 8, 120);
                    ctx.fillRect(ex + 12, 360, 8, 120);
                    ctx.fillRect(ex - 20, 360, 40, 8);
                    // Handles
                    ctx.fillRect(ex - 28, 380, 8, 30);
                    ctx.fillRect(ex + 20, 380, 8, 30);
                    ctx.fillStyle = '#e87040';
                    ctx.fillRect(ex - 20, 360, 3, 120);
                } else {
                    // Single horizontal bar
                    ctx.fillRect(ex - 10, 400, 6, 80);
                    ctx.fillRect(ex + 4, 400, 6, 80);
                    ctx.fillRect(ex - 12, 396, 28, 8);
                    ctx.fillStyle = '#e87040';
                    ctx.fillRect(ex - 10, 400, 3, 80);
                }
            }

            // Wooden benches bg (parallax 0.6x)
            const benchOff = -camX * 0.6;
            const bgBenches = [{x:400}, {x:1200}, {x:2400}, {x:3200}];
            for (let bb of bgBenches) {
                const bx = bb.x + benchOff;
                if (bx < -120 || bx > W + 120) continue;
                ctx.fillStyle = '#a07848';
                ctx.fillRect(bx, 450, 80, 10);
                ctx.fillStyle = '#7a5830';
                ctx.fillRect(bx + 6, 460, 6, 20);
                ctx.fillRect(bx + 68, 460, 6, 20);
            }

            // Covered pavilion bg (parallax 0.4x)
            const pavOff = -camX * 0.4;
            const pavX = 2800 + pavOff;
            if (pavX > -200 && pavX < W + 200) {
                ctx.fillStyle = '#444440';
                ctx.fillRect(pavX, 300, 200, 14);
                ctx.fillStyle = '#555550';
                ctx.fillRect(pavX + 10, 314, 6, 160);
                ctx.fillRect(pavX + 90, 314, 6, 160);
                ctx.fillRect(pavX + 184, 314, 6, 160);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(pavX, 314, 200, 100);
            }

            // Halden Kommune sign (neon signature)
            const signX = 1600 - camX * 0.6;
            ctx.fillStyle = '#ff00ff';
            ctx.fillRect(signX, 495, 30, 20);
            ctx.fillStyle = '#cc00cc';
            ctx.fillRect(signX + 2, 497, 26, 16);
            ctx.fillStyle = '#ff00ff';
            ctx.beginPath();
            ctx.arc(signX + 15, 494, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '5px monospace';
            ctx.fillText('HALDEN', signX + 1, 509);

            // Gutter line
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(0, groundY, W, 1);
        }

        function drawTrimparkGround() {
            const groundY = level.groundY;
            const W = canvas.width;

            // Asphalt base
            ctx.fillStyle = '#2a2a28';
            ctx.fillRect(0, groundY, W, canvas.height - groundY);

            // Texture streaks
            ctx.strokeStyle = '#3a3a38';
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.5;
            for (let ty = groundY + 8; ty < groundY + 50; ty += 14) {
                ctx.beginPath();
                ctx.moveTo(0, ty);
                ctx.lineTo(W, ty);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // Painted zone lines
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2;
            const lineSpacing = 300;
            const lOff = (-cameraX % lineSpacing + lineSpacing) % lineSpacing;
            for (let lx = lOff; lx < W; lx += lineSpacing) {
                ctx.beginPath();
                ctx.moveTo(lx, groundY + 10);
                ctx.lineTo(lx + 60, groundY + 10);
                ctx.stroke();
            }
        }

        function drawVictimHair(style, color, headW, headCY) {
            // headCY = head center Y position. Hair draws relative to it.
            ctx.fillStyle = color;
            if (style === 'buzz') {
                ctx.beginPath();
                ctx.ellipse(0, headCY - 8, headW * 0.9, 8, 0, Math.PI, Math.PI * 2);
                ctx.fill();
            } else if (style === 'curly') {
                for (let i = -3; i <= 3; i++) {
                    ctx.beginPath();
                    ctx.arc(i * 4, headCY - 10, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (style === 'ponytail') {
                ctx.beginPath();
                ctx.ellipse(0, headCY - 8, headW * 0.8, 10, 0, Math.PI, Math.PI * 2);
                ctx.fill();
                // Tail
                ctx.beginPath();
                ctx.moveTo(10, headCY - 6);
                ctx.quadraticCurveTo(24, headCY, 20, headCY + 16);
                ctx.lineWidth = 5;
                ctx.strokeStyle = color;
                ctx.stroke();
            } else if (style === 'bowl') {
                ctx.beginPath();
                ctx.ellipse(0, headCY - 4, headW * 1.1, 14, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (style === 'mohawk') {
                ctx.fillRect(-3, headCY - 22, 6, 20);
                ctx.fillRect(-2, headCY - 26, 4, 6);
            } else if (style === 'long') {
                ctx.beginPath();
                ctx.ellipse(0, headCY - 4, headW * 1.05, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                // Long sides
                ctx.fillRect(-headW - 2, headCY - 2, 6, 24);
                ctx.fillRect(headW - 4, headCY - 2, 6, 24);
            } else if (style === 'afro') {
                ctx.beginPath();
                ctx.arc(0, headCY - 6, 20, 0, Math.PI * 2);
                ctx.fill();
            }
            // 'bald' = no hair drawn
        }

        function drawVictims() {
            for (let v of level.victims) {
                const sx = v.x - cameraX;
                if (sx < -100 || sx > canvas.width + 100) continue;

                const wb = Math.sin(Date.now() / 400 + v.animationOffset) * 1.5;
                const isKid = v.type === 'kid';
                const scale = isKid ? 1.2
                    : v.type === 'lunchlady' ? 1.7
                    : v.type === 'security_guard' ? 1.6
                    : 1.45;

                ctx.save();
                ctx.translate(sx, v.y);
                ctx.scale(scale, scale);

                // Fainted = tilt over
                if (v.fainted) {
                    ctx.rotate(0.3);
                    ctx.translate(0, 10);
                }

                // Trauma shake
                if (v.trauma > 40 && !v.fainted) {
                    ctx.translate(Math.sin(Date.now() / 30) * (v.trauma / 40), 0);
                }

                const headW = 14;
                // === LEGS ===
                ctx.fillStyle = v.pantsColor;
                ctx.fillRect(-10, -14, 8, 14);
                ctx.fillRect(2, -14, 8, 14);
                // Shoes
                ctx.fillStyle = '#222';
                ctx.fillRect(-12, -2, 12, 5);
                ctx.fillRect(0, -2, 12, 5);

                // === BODY ===
                // Security guard: override shirt to dark navy
                if (v.type === 'security_guard') {
                    ctx.fillStyle = '#1a1a33';
                } else if (v.type === 'store_clerk') {
                    ctx.fillStyle = '#334488';
                } else {
                    ctx.fillStyle = v.shirtColor;
                }
                const bodyH = isKid ? 30
                    : v.type === 'lunchlady' ? 42
                    : v.type === 'security_guard' ? 42
                    : 36;
                ctx.fillRect(-16, -14 - bodyH, 32, bodyH);

                // Shirt detail
                if (v.type === 'nerd') {
                    // Pocket protector
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(4, -14 - bodyH + 6, 8, 10);
                    ctx.fillStyle = '#3366ff';
                    ctx.fillRect(6, -14 - bodyH + 7, 2, 8);
                    ctx.fillStyle = '#ff3333';
                    ctx.fillRect(9, -14 - bodyH + 8, 2, 6);
                } else if (v.type === 'teen') {
                    // Hoodie strings
                    ctx.strokeStyle = '#ddd';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-3, -14 - bodyH + 4);
                    ctx.lineTo(-3, -14 - bodyH + 16);
                    ctx.moveTo(3, -14 - bodyH + 4);
                    ctx.lineTo(3, -14 - bodyH + 16);
                    ctx.stroke();
                } else if (v.type === 'lunchlady') {
                    // Apron
                    ctx.fillStyle = '#eee';
                    ctx.fillRect(-12, -14 - bodyH + 10, 24, bodyH - 10);
                } else if (v.type === 'store_clerk') {
                    // Lanyard + name tag
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(-1, -14 - bodyH + 4, 2, 18);
                    ctx.fillStyle = '#eee';
                    ctx.fillRect(-5, -14 - bodyH + 20, 10, 6);
                } else if (v.type === 'shopper') {
                    // Casual jacket lapels
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.moveTo(-6, -14 - bodyH + 2);
                    ctx.lineTo(0, -14 - bodyH + 12);
                    ctx.lineTo(6, -14 - bodyH + 2);
                    ctx.fill();
                } else if (v.type === 'security_guard') {
                    // Badge
                    ctx.fillStyle = '#c8a030';
                    ctx.fillRect(-6, -14 - bodyH + 8, 10, 8);
                    ctx.fillStyle = '#111';
                    ctx.fillRect(-4, -14 - bodyH + 10, 6, 4);
                    // Belt at waist
                    ctx.fillStyle = '#111';
                    ctx.fillRect(-16, -14 - 4, 32, 4);
                    // Arms crossed when low trauma
                    if (v.trauma < 60) {
                        ctx.fillStyle = '#1a1a33';
                        ctx.fillRect(-22, -14 - bodyH + 20, 18, 8);
                        ctx.fillRect(4, -14 - bodyH + 20, 18, 8);
                    }
                }

                // === ARMS (hanging at sides) ===
                const armSwing = Math.sin(Date.now() / 300 + v.animationOffset) * 0.15;
                ctx.fillStyle = v.skin;
                // Left arm
                ctx.save();
                ctx.translate(-16, -14 - bodyH + 6);
                ctx.rotate(armSwing);
                ctx.fillStyle = v.shirtColor;
                ctx.fillRect(-5, 0, 8, 16);
                ctx.fillStyle = v.skin;
                ctx.fillRect(-4, 16, 6, 10);
                // Hand
                ctx.beginPath();
                ctx.arc(-1, 28, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                // Right arm
                ctx.save();
                ctx.translate(16, -14 - bodyH + 6);
                ctx.rotate(-armSwing);
                ctx.fillStyle = v.shirtColor;
                ctx.fillRect(-3, 0, 8, 16);
                ctx.fillStyle = v.skin;
                ctx.fillRect(-2, 16, 6, 10);
                ctx.beginPath();
                ctx.arc(1, 28, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // === TYPE-SPECIFIC PROPS ===
                if (v.type === 'shopper' && !v.fainted) {
                    // Shopping bags hanging from hands
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-30, -14 + 24, 14, 16);
                    ctx.fillStyle = '#dd2244';
                    ctx.fillRect(-28, -14 + 24, 10, 2);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(16, -14 + 24, 14, 16);
                    ctx.fillStyle = '#dd2244';
                    ctx.fillRect(18, -14 + 24, 10, 2);
                }
                if (v.type === 'security_guard' && !v.fainted) {
                    // Peaked cap
                    const capY = -14 - bodyH - 28;
                    ctx.fillStyle = '#1a1a33';
                    ctx.fillRect(-18, capY, 36, 8);
                    ctx.fillRect(-10, capY - 6, 20, 6);
                    ctx.fillStyle = '#c8a030';
                    ctx.fillRect(-18, capY + 8, 36, 2);
                }

                // === HEAD ===
                const headY = -14 - bodyH - 14;
                ctx.fillStyle = v.skin;
                ctx.beginPath();
                ctx.arc(0, headY + wb, headW, 0, Math.PI * 2);
                ctx.fill();

                // === HAIR ===
                drawVictimHair(v.hairStyle, v.hairColor, headW, headY + wb);

                // === FACE ===
                if (!v.fainted) {
                    // Eyes
                    if (v.crying) {
                        // Crying — squinting eyes
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.ellipse(-5, headY - 2 + wb, 4, 1.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(5, headY - 2 + wb, 4, 1.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                        // Tiny pupils
                        ctx.fillStyle = '#1a0800';
                        ctx.beginPath();
                        ctx.arc(-5, headY - 2 + wb, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(5, headY - 2 + wb, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                        // Eyebrow scrunch
                        ctx.strokeStyle = v.hairColor === '#ddd' ? '#999' : v.hairColor;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(-8, headY - 5 + wb);
                        ctx.lineTo(-2, headY - 7 + wb);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(2, headY - 7 + wb);
                        ctx.lineTo(8, headY - 5 + wb);
                        ctx.stroke();
                    } else {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.ellipse(-5, headY - 2 + wb, 4, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(5, headY - 2 + wb, 4, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Pupils
                    ctx.fillStyle = '#1a0800';
                    ctx.beginPath();
                    ctx.arc(-5, headY - 1 + wb, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(5, headY - 1 + wb, 2, 0, Math.PI * 2);
                    ctx.fill();
                    } // end else (not crying) eyes

                    // Eyebrows
                    ctx.strokeStyle = v.hairColor === '#ddd' ? '#999' : v.hairColor;
                    ctx.lineWidth = 2;
                    if (v.trauma > 30) {
                        // Worried
                        ctx.beginPath();
                        ctx.moveTo(-8, headY - 6 + wb);
                        ctx.lineTo(-2, headY - 8 + wb);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(2, headY - 8 + wb);
                        ctx.lineTo(8, headY - 6 + wb);
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(-8, headY - 7 + wb);
                        ctx.lineTo(-2, headY - 7 + wb);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(2, headY - 7 + wb);
                        ctx.lineTo(8, headY - 7 + wb);
                        ctx.stroke();
                    }

                    // Mouth
                    ctx.strokeStyle = '#884444';
                    ctx.lineWidth = 2;
                    if (v.crying) {
                        // CRYING — wide open wailing mouth
                        ctx.fillStyle = '#aa2233';
                        ctx.beginPath();
                        ctx.ellipse(0, headY + 6 + wb, 5, 6, 0, 0, Math.PI * 2);
                        ctx.fill();
                        // Tears streaming from eyes
                        ctx.fillStyle = 'rgba(80, 160, 255, 0.8)';
                        const tearY = Math.sin(Date.now() / 100) * 2;
                        ctx.fillRect(-6, headY + 1 + wb, 2, 10 + tearY);
                        ctx.fillRect(5, headY + 1 + wb, 2, 12 + tearY);
                        // More tears
                        ctx.fillRect(-4, headY + 3 + wb, 2, 8 + tearY);
                        ctx.fillRect(3, headY + 2 + wb, 2, 9 + tearY);
                    } else if (v.trauma > 50) {
                        // Scared O mouth
                        ctx.beginPath();
                        ctx.arc(0, headY + 6 + wb, 3, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        // Neutral
                        ctx.beginPath();
                        ctx.moveTo(-4, headY + 5 + wb);
                        ctx.lineTo(4, headY + 5 + wb);
                        ctx.stroke();
                    }

                    // Glasses for nerds
                    if (v.type === 'nerd') {
                        ctx.strokeStyle = '#222';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(-9, headY - 5 + wb, 8, 7);
                        ctx.strokeRect(1, headY - 5 + wb, 8, 7);
                        ctx.beginPath();
                        ctx.moveTo(-1, headY - 2 + wb);
                        ctx.lineTo(1, headY - 2 + wb);
                        ctx.stroke();
                    }
                } else {
                    // Fainted eyes (X X)
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 2.5;
                    // Left X
                    ctx.beginPath();
                    ctx.moveTo(-8, headY - 4 + wb);
                    ctx.lineTo(-2, headY + 2 + wb);
                    ctx.moveTo(-2, headY - 4 + wb);
                    ctx.lineTo(-8, headY + 2 + wb);
                    ctx.stroke();
                    // Right X
                    ctx.beginPath();
                    ctx.moveTo(2, headY - 4 + wb);
                    ctx.lineTo(8, headY + 2 + wb);
                    ctx.moveTo(8, headY - 4 + wb);
                    ctx.lineTo(2, headY + 2 + wb);
                    ctx.stroke();
                    // Tongue out
                    ctx.fillStyle = '#cc6666';
                    ctx.beginPath();
                    ctx.ellipse(2, headY + 8 + wb, 3, 4, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Sweat when traumatized
                if (v.trauma > 30 && !v.fainted) {
                    ctx.fillStyle = 'rgba(100, 180, 255, 0.7)';
                    const sweatY = headY - 12 + wb + Math.sin(Date.now() / 200) * 3;
                    ctx.beginPath();
                    ctx.ellipse(headW + 2, sweatY, 2.5, 4, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
            // Draw boss if on level 3
            if (currentLevel === 3 && boss) boss.draw();
        }

        function drawParticles() {
            for (let p of level.particles) {
                const alpha = p.life / 60;
                ctx.globalAlpha = alpha;

                if (p.type === 'sparkle') {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - cameraX - 4, p.y - 4, 8, 8);
                } else if (p.type === 'coin') {
                    ctx.fillStyle = '#00ff88';
                    ctx.font = 'bold 22px Arial';
                    ctx.fillText('💰', p.x - cameraX - 12, p.y);
                } else if (p.type === 'heart') {
                    ctx.fillStyle = '#ff00aa';
                    ctx.font = '22px Arial';
                    ctx.fillText('💖', p.x - cameraX - 12, p.y);
                } else if (p.type === 'text') {
                    ctx.fillStyle = '#ffff00';
                    ctx.font = 'bold 26px Press Start 2P';
                    ctx.fillText('$' + p.value, p.x - cameraX - 18, p.y);
                }
            }
            ctx.globalAlpha = 1;
        }

        function drawUI() {
            // Money
            document.getElementById('money').textContent = '$' + String(Math.floor(score)).padStart(4, '0');

            // Heat bar
            const heatPercent = Math.min(100, heat);
            document.getElementById('heat-bar').style.width = heatPercent + '%';

            // Combo
            document.getElementById('combo').textContent = '×' + combo;
            document.getElementById('combo').style.color = combo > 4 ? '#ffff00' : '#00ffff';

            // Boss bar (Level 3 only)
            if (currentLevel === 3 && boss) {
                const hpPct = Math.max(0, (boss.hp / boss.maxHp) * 100);
                const bossBarFill = document.getElementById('boss-bar');
                bossBarFill.style.width = hpPct + '%';
                bossBarFill.style.background = boss.phase === 1
                    ? 'linear-gradient(90deg, #ff6600, #ff0000)'
                    : boss.phase === 2
                        ? 'linear-gradient(90deg, #ff2200, #ff00aa)'
                        : 'linear-gradient(90deg, #ff00ff, #ff0000)';
                if (boss.hp < boss.maxHp * 0.15) {
                    bossBarFill.style.opacity = Math.sin(Date.now() / 100) > 0 ? '1' : '0.4';
                } else {
                    bossBarFill.style.opacity = '1';
                }
                document.getElementById('boss-phase').textContent = 'PHASE ' + boss.phase;
            }
        }

        function checkWinCondition() {
            if (currentLevel === 3) return; // handled by boss defeat
            if (score >= WIN_SCORE[currentLevel] && heat < 95) {
                gameState = 'levelcomplete';
                document.getElementById('level-complete-screen').style.display = 'flex';
                document.getElementById('level-score').innerHTML = `${level.name.toUpperCase()}<br>LUNCH MONEY: <span style="color:#00ff00">$${score}</span><br>HEAT: ${Math.floor(heat)}%`;
            }
        }

        // Police siren using Web Audio
        let sirenCtx = null;
        let sirenOsc = null;
        let sirenGain = null;
        function playSiren() {
            if (sirenCtx) return; // already playing
            sirenCtx = new (window.AudioContext || window.webkitAudioContext)();
            sirenOsc = sirenCtx.createOscillator();
            sirenGain = sirenCtx.createGain();
            sirenOsc.type = 'sawtooth';
            sirenGain.gain.value = 0.25;
            sirenOsc.connect(sirenGain).connect(sirenCtx.destination);
            sirenOsc.start();
            // Sweep frequency up and down for wailing siren
            function sweepSiren() {
                if (!sirenCtx) return;
                const now = sirenCtx.currentTime;
                sirenOsc.frequency.setValueAtTime(600, now);
                sirenOsc.frequency.linearRampToValueAtTime(900, now + 0.5);
                sirenOsc.frequency.linearRampToValueAtTime(600, now + 1.0);
                setTimeout(sweepSiren, 1000);
            }
            sweepSiren();
        }
        function stopSiren() {
            if (sirenCtx) {
                sirenOsc.stop();
                sirenCtx.close();
                sirenCtx = null;
                sirenOsc = null;
                sirenGain = null;
            }
        }

        // Police light overlay — drawn on canvas during gameover
        let policeLightInterval = null;
        function startPoliceLights() {
            if (policeLightInterval) return;
            let phase = 0;
            policeLightInterval = setInterval(() => {
                phase = (phase + 1) % 2;
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = phase === 0 ? '#ff0000' : '#0044ff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.globalAlpha = 1;
            }, 250);
        }
        function stopPoliceLights() {
            if (policeLightInterval) {
                clearInterval(policeLightInterval);
                policeLightInterval = null;
            }
        }

        function checkGameOver() {
            if (heat >= 100) {
                gameState = 'gameover';
                playSiren();
                startPoliceLights();
                // Delay showing the screen so lights flash first
                setTimeout(() => {
                    stopPoliceLights();
                    document.getElementById('game-over-screen').style.display = 'flex';
                    document.getElementById('final-score').innerHTML = `YOU ROBBED $<span style="color:#ffff00">${score}</span><br>BUT THE COPS GOT YOU`;
                }, 2000);
            }
        }

        function gameLoop() {
            if (gameState !== 'playing') {
                requestAnimationFrame(gameLoop);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updatePlayer();
            updateVictims();
            updateParticles();

            // Heat decay if playing well
            if (Math.random() < 0.02) heat = Math.max(0, heat - 0.6);

            comboTimer--;
            if (comboTimer <= 0) combo = Math.max(1, combo - 1);

            drawBackground();
            // Draw ground and platforms
            drawGround();
            // Elevated platforms
            for (let p of level.platforms) {
                if (p.y >= 520) continue; // skip ground platform
                const ppx = p.x - cameraX;
                if (ppx + p.w < -20 || ppx > canvas.width + 20) continue;

                if (currentLevel === 1) {
                    // Wood plank look
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fillRect(ppx + 4, p.y + 4, p.w, p.h);
                    ctx.fillStyle = '#5a3a1a';
                    ctx.fillRect(ppx, p.y, p.w, p.h);
                    ctx.strokeStyle = '#4a2a10';
                    ctx.lineWidth = 1;
                    for (let lx = ppx + 20; lx < ppx + p.w; lx += 30) {
                        ctx.beginPath();
                        ctx.moveTo(lx, p.y);
                        ctx.lineTo(lx, p.y + p.h);
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#7a5a3a';
                    ctx.fillRect(ppx, p.y, p.w, 3);
                } else if (currentLevel === 2) {
                    // Concrete/slab look for Skofabrikken
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.fillRect(ppx + 3, p.y + 4, p.w, p.h);
                    ctx.fillStyle = '#aaa890';
                    ctx.fillRect(ppx, p.y, p.w, p.h);
                    ctx.fillStyle = '#c8c6b8';
                    ctx.fillRect(ppx, p.y, p.w, 2);
                    // Slab joint lines every 40px
                    ctx.strokeStyle = '#8a8878';
                    ctx.lineWidth = 1;
                    for (let lx = ppx + 40; lx < ppx + p.w; lx += 40) {
                        ctx.beginPath();
                        ctx.moveTo(lx, p.y);
                        ctx.lineTo(lx, p.y + p.h);
                        ctx.stroke();
                    }
                } else if (currentLevel === 3) {
                    // Orange fitness bar look for Trimpark
                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    ctx.fillRect(ppx + 3, p.y + 5, p.w, p.h);
                    ctx.fillStyle = '#8a3010';
                    ctx.fillRect(ppx, p.y, p.w, p.h);
                    ctx.fillStyle = '#c85020';
                    ctx.fillRect(ppx + 1, p.y + 1, p.w - 2, p.h - 2);
                    ctx.fillStyle = '#e87040';
                    ctx.fillRect(ppx, p.y, p.w, 2);
                }
            }

            drawVictims();
            drawPlayer();
            drawParticles();
            drawUI();

            checkWinCondition();
            checkGameOver();

            requestAnimationFrame(gameLoop);
        }

        function loadLevel(n) {
            boss = null;
            level.victims = [];
            level.particles = [];
            level.moneyBags = [];
            document.getElementById('boss-bar-container').style.display = n === 3 ? 'flex' : 'none';

            if (n === 1) {
                level.name = "Playground Panic";
                level.groundY = 520;
                level.bgColor = '#1a0033';
                level.platforms = [
                    {x:0, y:520, w:LEVEL_WIDTH, h:200},
                    {x:600, y:400, w:280, h:20},
                    {x:1100, y:320, w:180, h:20},
                    {x:1600, y:450, w:220, h:20},
                    {x:2100, y:280, w:300, h:20},
                    {x:2600, y:380, w:150, h:20},
                ];
            } else if (n === 2) {
                level.name = "Skofabrikken";
                level.groundY = 520;
                level.bgColor = '#1a2233';
                level.platforms = [
                    {x:0,    y:520, w:LEVEL_WIDTH, h:200},
                    {x:500,  y:460, w:300, h:16},
                    {x:1100, y:460, w:300, h:16},
                    {x:1700, y:460, w:300, h:16},
                    {x:2300, y:460, w:300, h:16},
                    {x:800,  y:420, w:120, h:12},
                    {x:2000, y:420, w:120, h:12},
                    {x:1400, y:380, w:200, h:14},
                    {x:600,  y:320, w:80,  h:14},
                    {x:2500, y:320, w:80,  h:14},
                ];
            } else if (n === 3) {
                level.name = "Stranda Trimpark";
                level.groundY = 520;
                level.bgColor = '#1a3a2a';
                level.platforms = [
                    {x:0,    y:520, w:LEVEL_WIDTH, h:200},
                    {x:400,  y:440, w:160, h:14},
                    {x:750,  y:360, w:160, h:14},
                    {x:1200, y:430, w:200, h:14},
                    {x:1600, y:400, w:140, h:14},
                    {x:2000, y:340, w:160, h:14},
                    {x:2400, y:450, w:180, h:14},
                    {x:2800, y:380, w:140, h:14},
                    {x:3200, y:340, w:220, h:14},
                ];
            }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            stopSiren();
            stopPoliceLights();
            playStartSound();
            gameState = 'playing';
            score = 0;
            heat = 12;
            combo = 1;
            cameraX = 0;
            player.x = 500;
            player.y = level.groundY - player.height - 20;
            loadLevel(currentLevel);
            spawnInitialVictims();
            gameLoop();
        }

        function restartGame() {
            document.getElementById('game-over-screen').style.display = 'none';
            currentLevel = 1;
            startGame();
        }

        function nextLevel() {
            document.getElementById('level-complete-screen').style.display = 'none';
            currentLevel = currentLevel < 3 ? currentLevel + 1 : 1;
            startGame();
        }

        // Boot the game
        window.onload = () => {
            document.getElementById('start-screen').style.display = 'flex';
        };
    </script>
</body>
</html>
